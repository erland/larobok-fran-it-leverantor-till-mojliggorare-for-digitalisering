  CAP-IT-12:
    id: CAP-IT-12
    name: Cybersäkerhet och tekniskt skydd
    source_file: cap-it-12/CAP-IT-12.yaml
    services:
    - id: PLS-079
      name: Säker extern system- och myndighetsanslutning
      platform_id: PLT-035
      generations:
