          verification: Agent saknar direkt skrivbehörighet och nekas uppdatering utan domänprövning.
    - id: PLS-097
      name: Federerad och styrd dataåtkomst
      platform_id: PLT-022
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Avgränsade rapportfrågor mot enskilda källor med förhandsprövade behörigheter.
          verification: Källans åtkomstkontroll respekteras vid utsökning.
        G2:
          function_priority: Viktig
          shared_platform_priority: Situationsberoende
          required_offering: Federerade läsfrågor med tidsgränser, källbelastningsskydd och ansvar för frågekostnad.
          verification: Felande källa ger definierat partiellt fel, inte felaktigt komplett resultat.
        G3:
          function_priority: Viktig
          shared_platform_priority: Viktig
          required_offering: Självbetjänad policykontrollerad federation med katalog, audit trail och kvoter.
          verification: En konsument får bara godkända attribut över två källsystem.
        G4:
          function_priority: Viktig
          shared_platform_priority: Kritisk
          required_offering: AI/agent-frågor begränsas via attributpolicy, syfte och frågekvoter utan breda datakopior.
          verification: Agent får avslag på otillåten join och frågan loggas.
    - id: PLS-074
      name: Geospatial informations- och karttjänst
      platform_id: PLT-015
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Lokal GIS-integration med dokumenterade koordinatsystem och datakällor.
          verification: Samma plats får korrekt position efter konvertering.
        G2:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: Samordnade geodatatjänster och uppdateringsfrekvens över flera fält- och ärendetjänster.
          verification: Ändrad kartkälla påverkar konsumenter kontrollerat.
        G3:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: Återanvändbara kartlager, geokodnings-API och attributåtkomst som standarderbjudande.
