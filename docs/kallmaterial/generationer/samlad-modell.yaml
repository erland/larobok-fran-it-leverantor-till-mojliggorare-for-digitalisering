        G2:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: Cache-policy för flera tjänster med invalidation och skydd mot stale reads.
          verification: Källa ändras och cache uppdateras inom fastställt toleransfönster.
        G3:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: Förvaltad cacheprofil med åtkomst, kvoter, mätvärden och automatisk livscykel.
          verification: Team kan starta och avveckla cache utan handbyggd drift och med kostnadstak.
        G4:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: Kortlivade AI-/agentcachedata isoleras efter användare, ändamål och dataklass.
          verification: Olika användare får aldrig varandras skyddade cacheposter.
    - id: PLS-081
      name: Förvaltad dokumentdatabas
