schema_version: '1.0'
title: Helhetsanalys – fyra generationer och tekniska IT-förmågor
date: '2026-11-07'
status: Referensbedömning, ingen organisationsspecifik nulägesmätning
source_basis:
  book: Från systemdrift till digital självständighet
  capability_baseline: Förmågeöversikt – tekniska IT-förmågor, baseline v1.1
  platform_baseline: Plattformsöversikt – konceptuella plattformar, baseline v1.1
  prior_analyses: 13 CAP-IT-xx-fördjupningar i /mnt/data/cap-it-xx/
method:
  source_grounded: Förmågenamn, relation CAP→PLS, PLS→PLT och tjänsternas uppdrag.
  architectural_interpretation: Generationskrav, kritikalitet, plattformsbehov, vågordning och beroendevägar.
  priority_caveat: Prioritet avser funktion, inte automatiskt gemensam tjänst. Kontextsatta etiketter får inte räknas
    som absoluta omdömen.
  scenario_dependence: Alla prioriteringar kräver validering mot verksamhetens systemkritikalitet, regulatorik,
    resurser och befintligt nuläge.
counts:
  capabilities: 13
  capability_to_service_relations: 112
  unique_services: 92
  shared_services: 16
  generation_profiles: 448
transitions:
  G1_G2:
    name: Från sammanhållna system till distribuerade IT-stöd
    goal: Sammanhängande och felsökbara tjänstekedjor med tydliga ansvar och kontrakt
    waves:
    - wave: 1
      name: A. Grundskydd och ägarskap
      caps:
      - '07'
      - 09
      - '12'
      - '13'
      why: Identifiera och skydda tjänster, data, trafik och återställningsmöjligheter innan tjänsteantalet ökar
        kraftigt.
    - wave: 2
      name: B. Reproducerbar teknisk leverans
      caps:
      - '10'
      - 08
      - '04'
      why: Få kontroll på kod, konfiguration, driftmiljö, datamigrering och releases.
    - wave: 3
      name: C. Samverkan över tjänstegränser
      caps:
      - '06'
      - '02'
      - '03'
      why: Versionera kontrakt och kunna återuppta/laga tvärsystemflöden; separat workflow/regelplattform endast
        vid behov.
    - wave: 4
      name: D. Användar- och informationshelhet
      caps:
      - '01'
      - '11'
      - '05'
      why: Motverka fragmenterad användarupplevelse och motstridiga rapporter över systemgränser.
    capability_movements:
      CAP-IT-09: Korrelerad övervakning och restore av beroendekedjor
      CAP-IT-08: Standardiserade runtimeprofiler och styrda ändringar
      CAP-IT-10: Versionskontroll, automatiska tester och repeterbara releaser
      CAP-IT-13: Kontrollerade tjänsteflöden och segmentering
      CAP-IT-07: Federation, maskinidentiteter och återkallelse
      CAP-IT-12: Samordnad hot-/sårbarhetshantering över tjänster
      CAP-IT-04: Dataägarskap, konsistens och schema-/migreringskontrakt
      CAP-IT-06: Versionshanterade API-/meddelandekontrakt, idempotens
      CAP-IT-01: Enhetlig användarresa över tjänstegränser
      CAP-IT-02: Återupptagningsbara tvärsystemprocesser vid behov
      CAP-IT-03: Reproducerbara, versionerade domänbeslut vid behov
      CAP-IT-11: Hantering av heterogen klientflotta
      CAP-IT-05: Konsistenta rapporter och spårbara datapipelines
  G2_G3:
    name: Från distribuerade IT-stöd till plattformsorienterad IT
    goal: Produktifierade, säkra och självbetjänade plattformstjänster med tydliga servicelöften
    waves:
    - wave: 1
      name: A. Plattformens minsta säkra produkt
      caps:
      - '10'
      - '07'
      - '12'
      - 09
      why: Koppla automatiserad leverans till identitet, policy, instrumentering och återställning.
    - wave: 2
      name: B. Självbetjänade resurser och kommunikation
      caps:
      - 08
      - '13'
      - '04'
      - '06'
      why: Inför konsumtionsbara tjänstekontrakt för runtime, nät, databas och integration.
    - wave: 3
      name: C. Standardmönster för användning
      caps:
      - '01'
      - '11'
      - '02'
      - '03'
      why: Erbjud återanvändbara komponenter och domännära byggblock, bara där återkommande behov finns.
    - wave: 4
      name: D. Data- och analysprodukter
      caps:
      - '05'
      why: Bygg gemensamma mått, sökning, pipelines och AI/ML-erbjudanden efter efterfrågan och datamognad.
    capability_movements:
      CAP-IT-09: Tjänstekvalitet och backup/observability som standardprofil
      CAP-IT-08: Självbetjänade körprofiler och livscykel
      CAP-IT-10: Gemensamma pipelines, IaC/GitOps och paved roads
      CAP-IT-13: Deklarativ policy och självbetjänad nätanslutning
      CAP-IT-07: Automatiserade identitets-/credentialflöden
      CAP-IT-12: Säkerhetskontroller som kod och guardrails
      CAP-IT-04: Självbetjänade databaser med säkerhet och livscykel
      CAP-IT-06: Produktifierad API-/meddelandeplattform
      CAP-IT-01: Förvaltade designsystem och klientstarter
      CAP-IT-02: Återanvändbara workflow-/case-byggblock vid återkommande behov
      CAP-IT-03: Delade regel- och beslutsfunktioner vid efterfrågan
      CAP-IT-11: Automatiserad enrollment och klientefterlevnad
      CAP-IT-05: Återanvändbar BI, sökning och datagrund
  G3_G4:
    name: Från plattformsorienterad IT till verksamhetsnära AI-utveckling
    goal: Delegerad digital utveckling med riskstyrda, mätbara och återkallbara tekniska mandat
    waves:
    - wave: 1
      name: A. Mandat och spärrar före skala
      caps:
      - '07'
      - '12'
      - '04'
      - '06'
      why: Avgränsa identiteter, agentåtkomst, datautbyte och maskinella åtgärder utifrån verksamhetsrisk.
    - wave: 2
      name: B. Kvalitet i produktion
      caps:
      - '10'
      - 09
      - '05'
      why: Integrera AI-utvärdering, ändringsspår, observability, kostnadskontroll och möjlighet att stoppa lösningar.
    - wave: 3
      name: C. Kontrollerade bygg- och körvägar
      caps:
      - 08
      - '13'
      - '01'
      - '11'
      why: Erbjud godkända mallar, körprofiler och kanaler för både professionella team och verksamhetsnära byggare.
    - wave: 4
      name: D. Verksamhetsstyrda processer och beslut
      caps:
      - '02'
      - '03'
      why: Möjliggör automation och AI-förslag utan att överlåta regelägarskap och verksamhetsbeslut till plattformen.
    capability_movements:
      CAP-IT-09: Automatisk telemetry, incidentkontroll och stopp av AI-flöden
      CAP-IT-08: Begränsade körprofiler, kvoter och automatisk avveckling
      CAP-IT-10: AI-assisterad utveckling med verifieringsgrindar och spårbarhet
      CAP-IT-13: Riskklassad nätaccess och egress för verktyg och agenter
      CAP-IT-07: Agentidentiteter, delegering och tidsbundna mandat
      CAP-IT-12: Data-/verktygsskydd, policykontroller och incidentrespons
      CAP-IT-04: Proveniens, åtkomst och retention för AI-konsumerad data
      CAP-IT-06: Behörighetsbunden, begränsad integration och verktygsanrop
      CAP-IT-01: Tillgängliga, granskningsbara AI-skapade gränssnitt
      CAP-IT-02: Verksamhetsnära arbetsflöden med mänskliga grindar
      CAP-IT-03: AI som regelförslag, inte obevakad regelägare
      CAP-IT-11: Riskstyrd klientåtkomst till nya verktyg
      CAP-IT-05: Godkänd modellåtkomst, grounding, evals och dataägarskap
capabilities:
  CAP-IT-09:
    id: CAP-IT-09
    name: Driftbarhet och motståndskraft
    source_file: cap-it-09/CAP-IT-09.yaml
    services:
    - id: PLS-037
      name: Backup och återställning
      platform_id: PLT-029
      generations:
        G1:
          function_priority: Kritisk
          shared_platform_priority: Situationsberoende
          required_offering: Fastställda datamängder och ägare; schemalagda skyddskopior, åtkomstskydd, separata
            kopior och dokumenterad manuell restore.
          verification: Återställ ett representativt objekt och en hel datamängd; dokumentera återställningstid
            och faktisk dataförlust.
        G2:
          function_priority: Kritisk
          shared_platform_priority: Viktig
          required_offering: Applikations- och datakonsistenta kopior tvärs databaser, köer och beroenden; säkrade
            kopior, versions- och schemahantering samt återställningsordning.
          verification: Genomför felövning med flera beroenden; visa att det återställda användarflödet har konsistenta
            data.
        G3:
          function_priority: Kritisk
          shared_platform_priority: Viktig
          required_offering: Katalogiserade, policybaserade backup-profiler; automatisk anslutning, retention, kryptering,
            isolering och självbetjänad restore i behörig omfattning; automatiserade restoreprov.
          verification: Nytt system väljer profil via API/mall; automatiserat test verifierar återskapande och dokumenterad
            RPO.
        G4:
          function_priority: Kritisk
          shared_platform_priority: Viktig
          required_offering: Automatiskt skydd även för verksamhetsbyggda appar, konfiguration, AI-arbetsflödens
            tillstånd, kunskapsindex och relevanta externa beroenden; klassningsstyrd återläsning, export och avslut.
          verification: Testa avveckling/återställning av en verksamhetsbyggd lösning med data, konfiguration och
            dokumenterad spårbarhet.
    - id: PLS-038
      name: Disaster Recovery och återställningsorkestrering
      platform_id: PLT-029
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: 'För kritiska IT-stöd: BIA, åtgärdsplan, beroendelista, alternativa miljöer och dokumenterad
            återstart; enkla system kan ha manuell plan.'
          verification: Bordsövning och praktisk återstartsövning mot överenskommen tidsgräns.
        G2:
          function_priority: Kritisk för verksamhetskritiska kedjor
          shared_platform_priority: Viktig
          required_offering: Karta över beroenden och felområden; sekvenserad återstart av API:er, data, meddelandeköer,
            identitet och nätverk; fallback vid partiell degradering.
          verification: Simulera bortfall av en kritisk beroendetjänst och återställ hela användarflödet, inte bara
            komponenthälsa.
        G3:
          function_priority: Kritisk för verksamhetskritiska kedjor
          shared_platform_priority: Viktig
          required_offering: Förvaltade återställningsprofiler, deklarativa beroenden, automatiserad miljöåterskapning,
            regelbundna övningar och mätning av faktisk RTO/RPO.
          verification: Felscenariot körs i isolerad övningsmiljö; resultat och återstående manuella steg publiceras.
        G4:
          function_priority: Kritisk för verksamhetskritiska kedjor
          shared_platform_priority: Viktig
          required_offering: Riskklassad kontinuitet för många små lösningar och AI-kedjor; snabbt stopp/isolering,
            återstart i känd version, beroende på externa modellleverantörer, manuell reservväg.
          verification: Genomför övning där modell- eller API-leverantör faller bort och en kritisk process kan
            fortsätta säkert.
    - id: PLS-035
      name: Central observability
      platform_id: PLT-008
      generations:
        G1:
          function_priority: Viktig
          shared_platform_priority: Bra att ha
          required_offering: System- och infrastrukturloggar, grundläggande mätvärden och tidskorrelation; central
            lagring där flera system behöver gemensam felsökning.
          verification: Gå från användarrapporterat fel till motsvarande server- och applikationslogg.
        G2:
          function_priority: Kritisk
          shared_platform_priority: Viktig
          required_offering: Gemensamma korrelations-ID, fördelade traces, mätvärden per tjänst och applikationsflöde,
            strukturerade loggar, servicekarta och riktad dataskyddsfiltrering.
          verification: Följ ett fel genom flera tjänster till den beroendekomponent som orsakat felet.
        G3:
          function_priority: Kritisk
          shared_platform_priority: Kritisk
          required_offering: Standardinstrumentering som ingår i utvecklingsmallar och runtime; självbetjänad åtkomst,
            multi-tenancy, datakvalitet, kostnadskontroll, retention och korrelationsstandard.
          verification: Nytt team får loggar, metrics och traces utan specialbeställning; mät kvot, fördröjning
            och täckning.
        G4:
          function_priority: Kritisk
          shared_platform_priority: Kritisk
          required_offering: 'Automatisk instrumentering även för AI/agentkedjor: versions-ID, modell- och promptkonfiguration,
            tool calls, latens, token-/kostnadssignaler och kvalitetsutfall utan röjande av känsligt innehåll.'
          verification: Spåra en misslyckad AI-process till komponent och version utan att persondata eller hemligheter
            läcker.
    - id: PLS-070
      name: Central teknisk audit trail
      platform_id: PLT-008
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: 'För system med skydds- eller spårbarhetskrav: skyddad registrering av administration,
            säkerhetskritiska ändringar och återläsning.'
          verification: Visa vem som ändrade en kritisk teknisk inställning och att spåret inte kan ändras obemärkt.
        G2:
          function_priority: Viktig för reglerade/kritiska kedjor
          shared_platform_priority: Situationsberoende
          required_offering: Gemensamma händelseidentifierare och identitetsreferenser över tjänstegränser; tidsstämplar
            och skydd mot efterhandsändring.
          verification: Korrekta aktörs- och systemreferenser kan bindas ihop vid ett tvärtjänsteingrepp.
        G3:
          function_priority: Viktig för reglerade/kritiska kedjor
          shared_platform_priority: Viktig
          required_offering: Gemensamt erbjudande för inkoppling, händelseschema, integritetsskydd, åtkomstkontroller,
            retention och verifierbar export; tydlig skillnad mot felsökningsloggar.
          verification: Kör kontroll av händelseintegritet, behörighetsstyrd sökning och fullständig export.
        G4:
          function_priority: Viktig för reglerade/kritiska kedjor
          shared_platform_priority: Viktig
          required_offering: Spårbara delegerade åtgärder från appar och AI-agenter med användare, agent-/workloadidentitet,
            verktygsanrop, beslutspunkt och stopp/återkallande; dataminimering.
          verification: Rekonstruera en agentutförd åtgärd inklusive mandat, bakomliggande system och återkallande.
    - id: PLS-036
      name: Övervakning och larm
      platform_id: PLT-008
      generations:
        G1:
          function_priority: Kritisk för kritiska IT-stöd
          shared_platform_priority: Situationsberoende
          required_offering: Grundläggande tillgänglighet, resursutnyttjande, backupjobb och batchflöden, med larmmottagare
            och jourväg enligt verksamhetskritikalitet.
          verification: 'Simulera tjänstestopp: larm når rätt funktion och leder till avhjälpning.'
        G2:
          function_priority: Kritisk
          shared_platform_priority: Viktig
          required_offering: End-to-end-hälsokontroller, felkvoter, latens och beroendestatus; mindre brus, tydlig
            jourkedja, deduplicering och larm på symptom.
          verification: Fel i en underliggande tjänst fångas som användarpåverkan med ansvarig mottagare.
        G3:
          function_priority: Kritisk
          shared_platform_priority: Kritisk
          required_offering: Standardiserad SLO-/larmhantering som del av plattformsprodukt; larmregler i kod, tjänstekatalog,
            runbooks, underhållsfönster och mätning av larmkvalitet.
          verification: Nytt team får fungerande larmmallar; falsklarm, åtgärdbarhet och svarstid mäts.
        G4:
          function_priority: Kritisk för kritiska flöden
          shared_platform_priority: Kritisk
          required_offering: Riskklassade larm för verksamhetslösningar, AI-kostnads- och kvalitetsavvikelser, plötsliga
            felaktiga agentåtgärder, automatisk avstängning samt tydligt mänskligt ingripande.
          verification: Överskridet risk-/kostnadsvärde utlöser korrekt notis och vid behov skyddsstopp med revisionsspår.
  CAP-IT-08:
    id: CAP-IT-08
    name: Applikationsexekvering och körmiljö
    source_file: cap-it-08/CAP-IT-08.yaml
    services:
    - id: PLS-032
      name: Virtual Machine Runtime
      platform_id: PLT-007
      generations:
        G1:
          function_priority: Kritisk för VM-baserade system
          shared_platform_priority: Situationsberoende
          required_offering: Garantera definierade OS-versioner, lagrings- och nätanslutning, resursisolering, patch-
            och konfigurationsrutiner; dokumentera ansvar för OS, middleware och app.
          verification: Skapa och återstarta en VM med dokumenterad kapacitet; testa åtkomst, patchfönster och avveckling.
        G2:
          function_priority: Viktig för VM-beroende tjänster
          shared_platform_priority: Viktig
          required_offering: Standardisera VM-profiler och nät/identitetskopplingar, automatisera skapande, säkerställ
            konsekvent konfiguration och definierade ägare när tjänster fördelas på fler VM.
          verification: Provisionera två isolerade VM-profiler repeterbart; verifiera konfigurationsdrift, förändringsspår
            och resursgränser.
        G3:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig där VM behövs
          required_offering: Erbjud deklarativa VM-profiler via API/IaC, policykontroller, kvoter, livscykel och
            standardanslutning till identitet, säkerhet och observerbarhet; tydliga kostnadssignaler.
          verification: Skapa, ändra och avveckla VM med automatiska regler och minimal manuell handpåläggning;
            kontrollera faktiska ansvar/kvoter.
        G4:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Ge styrd VM-runtime när verksamhetslösningar kräver särskild kompatibilitet; begränsa
            autonom provisionering genom identitet, kvoter, kostnadstak, godkända profiler och automatisk utgångstid.
          verification: Verifiera att icke-godkända VM-beställningar stoppas maskinellt och att testmiljöer stängs
            eller omprövas i tid.
    - id: PLS-091
      name: Förvaltad applikationsserverruntime
      platform_id: PLT-007
      generations:
        G1:
          function_priority: Kritisk där applikationen kräver den
          shared_platform_priority: Situationsberoende
          required_offering: Stabila versioner och konfigurationer, dokumenterade driftsättningar, datasource-/anslutningsdefinitioner,
            patchning och supportlivscykel.
          verification: Verifiera kompatibel deployment, start/stopp, anslutningar och återgång till föregående
            applikationsversion.
        G2:
          function_priority: Viktig för berörda applikationer
          shared_platform_priority: Viktig där flertal delar runtime
          required_offering: Stöd flera oberoende tjänster/instanser med separata konfigurationer, certifikat, beroenden,
            säker uppgradering och tydliga miljökontrakt.
          verification: Deployera två tjänster oberoende utan konfigurationsläckage; verifiera uppgraderingskompatibilitet.
        G3:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig för fortsatt middleware-portfölj
          required_offering: Publicera valbara, förvaltade runtimeprofiler med kompatibilitetsmatris, IaC/deklarativ
            konfiguration, automatiserad provisionering och tydlig livscykel. Körning på VM eller container är en
            separat realiseringsfråga.
          verification: Skapa ny applikationsinstans genom standardväg och uppgradera inom angivna underhållsvillkor
            utan specialbeställning.
        G4:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Behåll säkra kompatibilitetsprofiler där verksamhetsnära lösningar återanvänder äldre
            tjänster; erbjud väl dokumenterade API-gränser snarare än fri administrativ runtimeåtkomst.
          verification: Verifiera att verksamhetsapp kan använda godkänt API utan administrationsrättigheter i applikationsservern.
    - id: PLS-031
      name: Container Application Runtime
      platform_id: PLT-007
      generations:
        G1:
          function_priority: Bra att ha
          shared_platform_priority: Situationsberoende
          required_offering: Kontrollerad containerhost eller runtime kan användas, men är inte generell förutsättning
            för väl fungerande monolit. Definiera images, resurser och sekretess.
          verification: Starta och stoppa applikationen reproducerbart; kontrollera imagekälla och resursförbrukning.
        G2:
          function_priority: Viktig för containerbaserade mikrotjänster
          shared_platform_priority: Viktig
          required_offering: Isolera tjänster, deklarera resurser, exponeringsgränser, identitet, konfiguration
            och hälsokontroller; definiera rollout- och skalningsbeteende genom samspel med CAP-IT-10 och CAP-IT-09.
          verification: Skala en tjänst, simulera krasch och påvisa isolering och självständig utrullning.
        G3:
          function_priority: Viktig för containerportföljen
          shared_platform_priority: Kritisk om container är organisationens standardväg
          required_offering: 'Tydliga runtimeprofiler som produkter: API/IaC, namespace-/tenantisolering, kvoter,
            policy, image- och versionsstöd, automatiserad säker grundkonfiguration samt inbyggda integrationer
            mot övriga plattformar.'
          verification: Skapa en ny tjänst från mall utan ticket, få standardansluten identitet/telemetri och se
            policyavslag vid osäker konfiguration.
        G4:
          function_priority: Viktig för många nya applikationer
          shared_platform_priority: Viktig
          required_offering: Maskinkonsumerbara, riskklassade profiler för AI-assisterad utveckling; tidsbegränsade
            previewmiljöer, kvoter, kostnadsgränser, isolering, ägarspårbarhet och möjlighet till säker paus/stopp.
          verification: Låt automatiserat utvecklingsflöde skapa testmiljö inom kvot och avvisa otillåten nätåtkomst/privilegier.
    - id: PLS-033
      name: Batch- och jobbkörning
      platform_id: PLT-007
      generations:
        G1:
          function_priority: Kritisk där nattjobb/batch är verksamhetskritiska
          shared_platform_priority: Situationsberoende
          required_offering: Schemaläggning, beroenden, körtidsgränser, loggning, felstatus, omkörning och kontroll
            av in-/utdata.
          verification: Kör normal- och feljobb, verifiera larm och säker manuell omstart.
        G2:
          function_priority: Viktig där bakgrundsjobb finns
          shared_platform_priority: Viktig
          required_offering: Separera jobb per tjänst och miljö; standardisera retries, idempotens, låsning, samtidighetsgränser
            och tidsgränser. Beakta API/köberoenden.
          verification: Avbryt jobb mitt i körning och verifiera att omstart inte duplicerar verksamhetseffekter.
        G3:
          function_priority: Viktig
          shared_platform_priority: Viktig
          required_offering: 'Självbetjänade jobbprofiler: resurser, scheman, execution history, parametrar, eventtrigger,
            rättigheter, kvoter och standardtelemetri. Teknikval kan vara scheduler, containerjobb eller annan förvaltad
            tjänst.'
          verification: Ett team kan definiera, utlösa, se och avsluta jobb via API/IaC utan specialhandläggning.
        G4:
          function_priority: Viktig för automatiserade flöden
          shared_platform_priority: Viktig
          required_offering: Kortlivade AI-/datajobb med budget, tidsgränser, godkända verktyg, isolering och audit
            på uppdragsnivå. Kräv explicita kontrollpunkter innan jobb gör irreversibla sidoeffekter.
          verification: Testa att ett automatiserat jobb stoppas vid kvot/time-out och inte gör otillåtna skrivningar.
    - id: PLS-034
      name: Specialiserad och accelererad compute-runtime
      platform_id: PLT-007
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Dedikerad specialvärd eller computeprofil för dokumenterat beräkningsbehov, med drivrutins-
            och åtkomstkontroll.
          verification: Kör representativt jobb inom prestanda- och åtkomstkrav.
        G2:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Isolera resurskrävande arbetslaster, hantera prioritering/kö och tekniska beroenden
            över tjänstegränser.
          verification: Verifiera att två workloadklasser inte svälter varandra och att känsliga data isoleras.
        G3:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig vid återkommande behov
          required_offering: Definiera styrda GPU/acceleratorprofiler, kvoter, tilldelning, tillgänglig kapacitet,
            debitering och återanvändbar drivrutinsbaseline; hantera att vissa profiler har hårdvarulåsning.
          verification: En behörig konsument beställer profil via API, ser kvotkostnad och får förutsägbart exekveringsutfall.
        G4:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig om lokal AI/ML kräver acceleratorer
          required_offering: Styr GPU-konsumtion för AI, media och autonom bearbetning genom policy, kapacitetsgränser,
            budget och prioritet. Extern hanterad LLM kan minska behovet av lokal GPU.
          verification: Simulera kvotöverträdelse och avbryt dyrt jobb; visa nyttjande och kostnad per ansvarig.
    - id: PLS-078
      name: Workloadskydd
      platform_id: PLT-011
      generations:
        G1:
          function_priority: Kritisk för högriskworkloads
          shared_platform_priority: Situationsberoende
          required_offering: OS-/värdnära skydd, hårdning, detektion av skadligt beteende och definierad hantering
            av larm för relevanta workloads.
          verification: Verifiera härdning och att testlarm når ansvarig åtgärdskedja.
        G2:
          function_priority: Kritisk för högriskworkloads
          shared_platform_priority: Viktig
          required_offering: Skydd som omfattar VM/container/tjänstegränser, identifierar otillåten process-, nät-
            eller filaktivitet och kan koppla fynd till workloadägare.
          verification: Testa avvikande processaktivitet och spårbar hantering av fynd till rätt team.
        G3:
          function_priority: Kritisk för högriskworkloads
          shared_platform_priority: Viktig
          required_offering: Policybaserad anslutning till valda runtimeprofiler, riskklasser, undantagsprocess,
            uppföljning av täckning och teknisk integration med leverans/observability.
          verification: Skapa ny workload och verifiera automatisk skyddsanslutning samt blockering av policybrott.
        G4:
          function_priority: Kritisk för högriskworkloads
          shared_platform_priority: Viktig
          required_offering: Automatisk riskklassad kontroll även för verksamhetsbyggda workloads och autonoma exekveringar;
            stöd för karantän/stopp, spårning till ansvarig och mekanismer mot osäker verktygs-/systemåtkomst.
          verification: Försök köra otillåten åtgärd från AI-assisterad workload och verifiera blockering och spårbar
            eskalering.
  CAP-IT-10:
