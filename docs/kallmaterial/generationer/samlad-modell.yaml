        G4:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: Agent-/analysfrågor använder platsdata med geofencing, sekretess och upplösningsbegränsning.
          verification: Känslig plats maskeras för otillåtet användningsfall.
    - id: PLS-013
      name: Förvaltad fil-, block- och volymlagring
      platform_id: PLT-019
      generations:
        G1:
          function_priority: Kritisk
          shared_platform_priority: Viktig
          required_offering: Separat lagringsprovisionering, kapacitetsbevakning och ägare för beständig fil/block-data.
          verification: Full volym eller diskloss ger larm och prövad återställningsväg.
        G2:
          function_priority: Kritisk
          shared_platform_priority: Kritisk
          required_offering: Isolerade volymer per workload med konsekvent åtkomst och flytt-/snapshothantering.
          verification: Flytt av tjänst bibehåller data och intecknar inga grannvolymer.
        G3:
          function_priority: Kritisk
          shared_platform_priority: Kritisk
          required_offering: Självbetjänade lagringsklasser, kvoter, livscykel och krypteringsprofiler för applikationer.
          verification: PVC/volym skapas, expanderas och avvecklas via policy med spårbarhet.
        G4:
          function_priority: Kritisk
          shared_platform_priority: Kritisk
          required_offering: Kortlivade verksamhetslösningar har automatisk gallring och separation mellan tillfälligt
            och beständigt tillstånd.
          verification: Avveckling raderar kopior enligt beslutad retention utan att radera bevarandepliktiga data.
    - id: PLS-011
      name: Objektlagring
      platform_id: PLT-019
      generations:
        G1:
          function_priority: Viktig
          shared_platform_priority: Situationsberoende
          required_offering: Avgränsad bloblagring med åtkomstlistor, namngivning och dokumenterad retention.
          verification: Objekt kan återfinnas och verifieras efter avtalad arkiveringsperiod.
        G2:
          function_priority: Viktig
          shared_platform_priority: Viktig
          required_offering: Gemensamma säkra buckets, versionshantering, livscykelregler och händelseintegration.
          verification: Felaktig överskrivning upptäcks och tidigare version kan återtas.
        G3:
          function_priority: Kritisk
          shared_platform_priority: Kritisk
          required_offering: Förvaltade objektklasser och självbetjänad provisionering med policy, kryptering och
            retention.
          verification: Team skapar klassad bucket med korrekta standardregler utan manuella steg.
        G4:
          function_priority: Kritisk
          shared_platform_priority: Kritisk
          required_offering: AI-artefakter, promptbilagor och dataset lagras med ändamål, proveniens och automatisk
            tidsgräns.
          verification: AI-process får inte lägga känsliga resultat i oklassad allmän bucket.
    - id: PLS-088
      name: Mediebearbetning och transkodning
      platform_id: PLT-016
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Kontrollerad konvertering i applikation vid faktiskt mediebehov och bevarat original.
          verification: Utdata kan spåras till oförändrat original.
        G2:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: Asynkron transkodning med kö, retry och format-/codecstandarder för flera tjänster.
          verification: Stor video konverteras utan att blockera kundflöde; fel kan återköras.
        G3:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: Självbetjänat API för standardformat, malwarekontroll och återanvändbara renditions.
          verification: Klient begär ny preview med definierad profil och livscykel.
        G4:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: AI-medieflöden får rättigheter, metadata och proveniens från original genom hela kedjan.
          verification: Derivat kan inte publiceras eller återanvändas utanför källans tillåtna ändamål.
    - id: PLS-075
      name: Mobil fältapplikationsgrund och offline-synkronisering
      platform_id: PLT-025
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Enskild app har krypterat lokalt cache-/offlineunderlag och manuell konflikthantering.
          verification: Avbrott och återanslutning medför inte tyst dataförlust.
        G2:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: Synkronisering med checkpoint, konfliktstrategier och säkra enhetsidentiteter över
            tjänster.
          verification: Samma ändring från två enheter ger spårbar konflikt, inte last-write-wins utan kontroll.
        G3:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: Återanvändbar offline-SDK/profil med dataurval, retention och central livscykel.
          verification: Fältteam startar app från mall och kan demonstrera återupptagen synk efter avbrott.
        G4:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: AI-stöd i fält får lokala sekretessgränser och kan stängas av när datastatus är osäker.
          verification: Agent avstår från riskfyllt beslut på inaktuella offlineuppgifter.
    - id: PLS-084
      name: Mallbaserad dokumentgenerering
      platform_id: PLT-002
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Systemlokala dokumentmallar med version och kontrollerad datamappning.
          verification: Genererat dokument kan kopplas till mallversion och insatsdata.
        G2:
          function_priority: Viktig
          shared_platform_priority: Viktig
          required_offering: Gemensam generering med versionshanterade mallar, central kvalitet och deterministiska
            utdata.
          verification: Tidigare dokument återskapas med ursprunglig mall och data.
        G3:
          function_priority: Viktig
          shared_platform_priority: Viktig
          required_offering: Självbetjänat dokument-API med typade data, godkända mallar och lagringsintegration.
          verification: Team genererar PDF/A och visar spårbar leverans utan specialkod.
        G4:
          function_priority: Viktig
          shared_platform_priority: Viktig
          required_offering: AI kan hjälpa till att förbereda underlag men rättsligt betydelsefulla dokument kommer
            från godkänd mall och data.
          verification: Agent kan inte ändra styrande mall utan granskat godkännande.
  CAP-IT-06:
    id: CAP-IT-06
    name: Integration och informationsutbyte
    source_file: cap-it-06/CAP-IT-06.yaml
    services:
    - id: PLS-020
      name: API Management
      platform_id: PLT-005
      generations:
        G1:
          function_priority: Kritisk där API används
          shared_platform_priority: Situationsberoende
          required_offering: Identifierade systemgränssnitt med ägare, dokumenterat format, säker åtkomst och manuell
            versions-/ändringskontroll. En särskild API-gateway är inte generellt nödvändig.
          verification: Ägare och kontrakt för externt anrop kan hittas; fel format nekas med definierat fel.
        G2:
          function_priority: Kritisk där API används
          shared_platform_priority: Viktig
          required_offering: Versionshanterade API-kontrakt, gateway/skydd där exponeringsrisk finns, konsumentinventering,
            tidsgränser och kontrollerade breaking changes mellan distribuerade tjänster.
          verification: En äldre konsument fungerar under planerad versioneringsövergång; icke behörig konsument
            nekas.
        G3:
          function_priority: Kritisk där API används
          shared_platform_priority: Kritisk vid många team
          required_offering: Självbetjänad API-publicering via mall/API, dokumenterad developer experience, policyprofiler
            för auth, kvoter och rate limiting, automatiska kontrakts-/säkerhetstester och mätbar avveckling.
          verification: Ett team publicerar ett API enligt godkänd mall utan manuell specialistkedja, med testad
            rollback och registrerade konsumenter.
        G4:
          function_priority: Kritisk där API används
          shared_platform_priority: Kritisk vid bred agentåtkomst
          required_offering: Agent- och verksamhetsutvecklade konsumenter får avsikts-, identitets- och riskstyrd
            API-åtkomst via avgränsade verktyg; policy och kostnad/kvot synlig per uppdrag; högriskåtgärder kräver
            kontroll.
          verification: En agent med läsmandat kan inte anropa ändrings-API; begärda kvoter och delegerat mandat
            kan återkallas.
    - id: PLS-024
      name: Integrationsorkestrering och adaptering
      platform_id: PLT-005
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Enkla punkt-till-punkt-adaptrar och formatöversättningar dokumenteras; tekniska integrationsfel
            kan omköras. Central orkestreringsmotor bara vid faktiskt behov.
          verification: En felaktig transformation upptäcks, dokumenteras och åtgärdas utan dataförlust.
        G2:
          function_priority: Viktig där många adapterbehov
          shared_platform_priority: Viktig
          required_offering: Återanvändbara adaptrar, idempotent meddelandehantering, korrelations-ID och kontrollerad
            teknisk retry; undvik central punkt som äger all domänlogik.
          verification: Dubbel leverans skapar inte dubbla affärshändelser; fel kan korreleras till ursprung.
        G3:
          function_priority: Viktig där återkommande adapterbehov
          shared_platform_priority: Viktig
          required_offering: Förvaltade adapterprofiler och transformationer som versionerade, testade tjänster
            med självbetjänad driftsättning, spårbar mapping och säkra standardinställningar.
          verification: Nytt integrationsflöde byggs av godkända mallar och testas automatiskt i CI/CD.
        G4:
          function_priority: Viktig där agentverktyg integreras
          shared_platform_priority: Viktig
          required_offering: Policykontrollerad anslutning av AI-/verksamhetsflöden till godkända adapterverktyg,
            tydlig separation mellan teknisk orkestrering och domänbeslut; ändringar kan rullas tillbaka.
          verification: AI-initierat integrationsanrop utan godkänd resurs eller åtgärd stoppas och kan spåras.
    - id: PLS-021
      name: Enterprise Messaging
      platform_id: PLT-034
      generations:
        G1:
          function_priority: Kritisk där tillförlitlig kö behövs
          shared_platform_priority: Situationsberoende
          required_offering: Kö-/meddelandefunktion där batch/asynkrona flöden kräver det; definierad leveranssemantik,
            beständighet, kvittens och manuella fellistor.
          verification: Vid konsumentstopp kan meddelande återlevereras och hanteras utan tyst förlust.
        G2:
          function_priority: Kritisk där tillförlitlig kö behövs
          shared_platform_priority: Viktig
          required_offering: Förvaltade köer med retry, dead-letter-kö, backpressure, korrelations-ID och idempotenta
            konsumenter; dimensionera och separera felområden.
          verification: Tre upprepade leveranser ger högst en domäneffekt; poison message isoleras.
        G3:
          function_priority: Kritisk där tillförlitlig kö behövs
          shared_platform_priority: Kritisk vid många kökonsumenter
          required_offering: Köer som självbetjänade produkter med åtkomstpolicy, retention, kvoter, schema-/versionskontroll,
            automatiserade kapacitets- och återställningsprov.
          verification: Nytt team får köprofil och larm enligt mall samt bevis för retention/behörighet/återställning.
        G4:
          function_priority: Kritisk där tillförlitlig kö behövs
          shared_platform_priority: Viktig
          required_offering: Säker asynkron hantering av AI-/verksamhetsuppdrag med begränsad livslängd, avbrytning,
            tydlig ansvarig aktör och säkra kompensationsmönster.
          verification: Återkallat agentuppdrag kan inte fortsätta verkställas från en gammal köpost.
    - id: PLS-022
      name: Event Streaming och Pub/Sub
      platform_id: PLT-034
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Bra att ha
          required_offering: Enkla notifieringar eller händelseutbyte kan förekomma; strömplattform är normalt inte
            nödvändig för ett fåtal monoliter.
          verification: En händelse kan identifieras och konsumtionsbehov kan motiveras innan teknik införs.
        G2:
          function_priority: Viktig vid eventdriven arkitektur
          shared_platform_priority: Situationsberoende
          required_offering: Publicera domänhändelser med ägare, kontrakt, nycklar, ordningsantaganden, retention
            och oberoende konsumenter; kontrollera replay och dubbletter.
          verification: Ny konsument återspelar valt intervall utan att påverka producenten; dubbletter hanteras.
        G3:
          function_priority: Viktig vid eventdriven arkitektur
          shared_platform_priority: Viktig där strömmar används
          required_offering: Självbetjänad topic-/strömprofil med register, schemaevolution, åtkomstpolicy, kvoter,
            retention och automatiska kompatibilitetstester.
          verification: En ny topic provisioneras med godkänd schema-/retentionsprofil och nekad otillåten prenumeration.
        G4:
          function_priority: Viktig vid omfattande AI-eventflöden
          shared_platform_priority: Viktig där strömmar används
          required_offering: AI-/verksamhetslösningar får explicit tillåten konsumtion av relevanta händelser; replay,
            informationsklass och händelsers giltighet begränsas per syfte.
          verification: En agent nekas åtkomst till otillåten topic och upphör konsumera efter att uppdraget avslutats.
    - id: PLS-080
      name: Kontraktsregister och meddelandevalidering
      platform_id: PLT-034
      generations:
        G1:
          function_priority: Viktig där kontrakt används
          shared_platform_priority: Bra att ha
          required_offering: Versionsnummer, schema och godkännanderutin dokumenteras tillsammans med integrationsägare;
            central registerprodukt inte alltid nödvändig.
          verification: En schemaändring har ägare och dokumenterat utfall innan driftsättning.
        G2:
          function_priority: Viktig där kontrakt används
          shared_platform_priority: Viktig
          required_offering: Delad sökbar kontraktskatalog med kompatibilitetsregler; automatiserade consumer/provider-tester,
            schema-validering och migrationsfönster.
          verification: En inkompatibel ändring stoppas av test eller validering innan produktion.
        G3:
          function_priority: Viktig där kontrakt används
          shared_platform_priority: Kritisk vid många oberoende team
          required_offering: Kontrakt som självbetjänade, versionsstyrda artefakter med kvalitetspipeline, ägarmetadata,
            schema-policy och automatiserade brytändringskontroller.
          verification: En ny meddelandetyp måste passera kompatibilitetskontroll och kan spåras till konsumenter.
        G4:
          function_priority: Viktig där kontrakt används
          shared_platform_priority: Kritisk vid omfattande maskinkonsumenter
          required_offering: Maskinläsbara kontrakt för agentverktyg och datakonsumenter, explicit åtkomst och schemakvalitet,
            automatiserad upptäckt av drift från förväntat kontrakt.
          verification: Agenten kan inte utföra verktygsanrop med otillåtet/okänt schema eller datautbyte.
    - id: PLS-023
      name: Managed File Transfer
      platform_id: PLT-035
      generations:
        G1:
          function_priority: Kritisk där filutbyte används
          shared_platform_priority: Situationsberoende
          required_offering: Säker filtransport med avsändar-/mottagaridentifiering, kvittens, integritetskontroll,
            återleverans och manuella rutiner.
          verification: Levererad fil har checksumma, kvittens och återhämtningsrutin.
        G2:
          function_priority: Kritisk där filutbyte används
          shared_platform_priority: Viktig där många filflöden
          required_offering: Spårbara filer över organisationsgränser med tekniska profiler, avtalade scheman, kvittens,
            omkörning och dataskydd/retention.
          verification: Felaktig/upprepad fil isoleras och kan återlevereras utan dubbla domäneffekter.
        G3:
          function_priority: Kritisk där filutbyte används
          shared_platform_priority: Kritisk vid omfattande filflöden
          required_offering: Självbetjänad filöverföringsprofil med partnerspecifika behörigheter, onboarding, automatisk
            antivirus-/innehållskontroll enligt risk och mätbart SLA.
          verification: Ny filkanal kan etableras via mall med godkända kontroller och avvecklas utan kvarvarande
            konto.
        G4:
          function_priority: Kritisk där filutbyte används
          shared_platform_priority: Viktig där agentdrivet filutbyte finns
          required_offering: Tillåten och tidsbegränsad filåtkomst för verksamhetsnära lösningar; AI får inte fritt
            exportera material utan klassning, kontroll och spårbar mottagare.
          verification: Agentförsök att exportera klassad fil till otillåten part stoppas.
    - id: PLS-079
      name: Säker extern system- och myndighetsanslutning
      platform_id: PLT-035
      generations:
        G1:
          function_priority: Kritisk vid extern anslutning
          shared_platform_priority: Situationsberoende
          required_offering: Projektvis godkänd extern kommunikation med identifierad motpart, ansvarig, säkert
            protokoll och dokumenterad avveckling.
          verification: En borttagen partners anslutning är spärrad och ansvarig mottagare är känd.
        G2:
          function_priority: Kritisk vid extern anslutning
          shared_platform_priority: Viktig vid flera partners
          required_offering: Konsekvent extern partneronboarding, certifikat-/identitetskontroller, segmentering,
            teknisk loggning, incidentkontakt och ägda kontrakt.
          verification: En certifikatrotation eller partnerstörning upptäcks och återställs enligt avtalad rutin.
        G3:
          function_priority: Kritisk vid extern anslutning
          shared_platform_priority: Kritisk vid omfattande partnerportfölj
          required_offering: Standardiserad anslutningsprofil per riskklass, automatiserade kontroller, katalog
            över motparter, självbetjäning av låg risk och styrd avveckling.
          verification: Ny partner får godkänd profil och kan onboardas utan ad hoc-brandväggsundantag i normalfall.
        G4:
          function_priority: Kritisk vid extern anslutning
          shared_platform_priority: Kritisk vid extern agentåtkomst
          required_offering: Villkorade agent- och verksamhetskopplingar med uttrycklig tillåtelselista per motpart,
            ändamål och transaktionsklass; mänsklig kontroll vid hög konsekvens.
          verification: Agent nekas göra extern överföring till en part som inte ingår i godkänt uppdrag.
    - id: PLS-075
      name: Mobil fältapplikationsgrund och offline-synkronisering
      platform_id: PLT-025
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Bra att ha
          required_offering: Enstaka offlineflöden kan hanteras applikationsvis med lokalt dataskydd, manuell konfliktupplösning
            och tydlig sista-synk-indikering.
          verification: Två motstridiga offlineuppdateringar kan upptäckas och lösas utan tyst informationsförlust.
        G2:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig vid flera fältappar
          required_offering: Flera klienter kräver återupptagbar synk, lokala köer, versionskontroll, konfliktregler
            och testad hantering av partiell anslutning.
          verification: Avbruten synk återupptas utan dubbletter och med begriplig konfliktorsak.
        G3:
          function_priority: Situationsberoende
          shared_platform_priority: Kritisk vid bred fältportfölj
          required_offering: Återanvändbar offline-/synkgrund med säker lokal datalivscykel, enhets-/identitetskoppling,
            självbetjänade SDK-profiler och automatiserade konflikttester.
          verification: Ny fältapp använder standard-SDK; förlorad enhets lokala data kan hanteras enligt policy.
        G4:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig där AI används i fält
          required_offering: Verksamhetsnära fältappar och AI-assistenter arbetar med säkert begränsad offlinekunskap,
            kan visa datans ålder och kräver ny auktorisation innan riskfylld synk/åtgärd.
          verification: AI-assistent med inaktuellt lokalt underlag markeras och kan inte verkställa otillåtet beslut
            offline.
  CAP-IT-01:
    id: CAP-IT-01
    name: Interaktion, presentation och kanaler
    source_file: cap-it-01/CAP-IT-01.yaml
    services:
    - id: PLS-001
      name: Design System-tjänst
      platform_id: PLT-001
      generations:
        G1:
          function_priority: Viktig
          shared_platform_priority: Bra att ha
          required_offering: Dokumenterade stilprinciper, semantisk HTML och ett litet komponentbibliotek; keyboard-/skärmläsartest
            för centrala mönster.
          verification: Prova tangentbordsnavigation och skärmläsare i tre kritiska komponenter och dokumentera
            avvikelser.
        G2:
          function_priority: Viktig
          shared_platform_priority: Viktig
          required_offering: Gemensamma tokens, navigation, fel- och väntelägen; tydliga kompatibilitetsregler när
            flera team återanvänder komponenter.
          verification: Två applikationer kan uppgradera samma knapp/dialog utan att förlora fokusordning eller
            visuellt sammanhang.
        G3:
          function_priority: Kritisk vid många team
          shared_platform_priority: Kritisk vid många team
          required_offering: Versionerade komponentpaket och design tokens, tillgänglighetsregression i CI, migrationsguider,
            deprecationspolicy, support och adoptionsmätning.
          verification: Ett nytt team importerar paket och får återanvändbara kontroller med automatiska tillgänglighets-
            och visuella regressionstester.
        G4:
          function_priority: Kritisk vid bred självutveckling
          shared_platform_priority: Kritisk vid bred självutveckling
          required_offering: Godkända komponenter för AI-genererade gränssnitt, tydlig visning av förslag kontra
            beslut, mänsklig kontroll vid riskfyllda handlingar och automatiska tillgänglighetskontroller.
          verification: Ett AI-genererat UI med otillgänglig dialog eller otydlig automatiskt utförd åtgärd stoppas
            i kontrollkedjan.
    - id: PLS-002
      name: Webbutvecklingsgrund
      platform_id: PLT-009
      generations:
        G1:
          function_priority: Viktig vid webb
          shared_platform_priority: Situationsberoende
          required_offering: Reproducerbar projektstruktur, säkra standardinställningar, användbara fel-/laddningslägen,
            dokumenterad uppdateringsväg.
          verification: Starta och bygg ett litet webbsystem reproducerbart, verifiera säker konfiguration och felmeddelanden.
        G2:
          function_priority: Kritisk vid många webbteam
          shared_platform_priority: Viktig
          required_offering: Delad klientarkitektur, API-kontrakt, standardiserad telemetri, säker tokenhantering
            och test av brutna beroenden.
          verification: Simulera otillgängligt backend-API; gränssnittet visar korrekt återhämtning och spårbar
            felkorrelation.
        G3:
          function_priority: Kritisk vid självbetjäning
          shared_platform_priority: Kritisk vid många team
          required_offering: Självbetjänad projektgenerator, testsvit, komponentintegration, dependency-uppdateringar
            och lättanvända säkra leveransmallar.
          verification: Nytt team får ett fungerande standardprojekt med tester och deploykontrakt utan manuell
            specialbeställning.
        G4:
          function_priority: Kritisk vid bred AI-assisterad webb
          shared_platform_priority: Kritisk vid många producenter
          required_offering: AI-assisterad kodgenerering sker inom signerade och versionsstyrda mallar; automatisk
            testning av UI, integritet och tillgänglighet, begränsade agentverktyg.
          verification: Agentgenererad webbfunktion går inte i produktion utan samma kvalitetsgrindar och ägarattest
            som mänskligt skriven kod.
    - id: PLS-003
      name: Formulärstjänst
      platform_id: PLT-002
      generations:
        G1:
          function_priority: Viktig där formulär används
          shared_platform_priority: Situationsberoende
          required_offering: Lokalt formulär med fältregler, begriplig validering, säker inmatning och stöd för
            avbrutna steg.
          verification: Ogiltiga värden stoppas och förklaras utan att tidigare inmatning försvinner.
        G2:
          function_priority: Viktig vid många formulär
          shared_platform_priority: Situationsberoende
          required_offering: Delade scheman, versionering av fält och förutsägbar felhantering mot flera tjänster;
            formulär skickar data via definierade API:er.
          verification: Ändrad fältdefinition hanteras kompatibelt av två klientversioner under övergångsperiod.
        G3:
          function_priority: Viktig vid återkommande formulär
          shared_platform_priority: Viktig vid stor återanvändning
          required_offering: Versionerade formulärdefinitioner, valideringskontrakt, tillgängliga standardkomponenter,
            testmiljö och konfigurerbar publiceringsprocess.
          verification: Nytt formulär kan publiceras via godkänt flöde med automatiska validerings- och tillgänglighetstester.
        G4:
          function_priority: Viktig för verksamhetsnära formulär
          shared_platform_priority: Viktig vid kontrollerad självutveckling
          required_offering: Riskstyrd självbetjäning för formulärskapande; AI får föreslå fält men publicering,
            personuppgiftshantering och verksamhetsvalidering kräver ansvarig godkännare.
          verification: AI-föreslaget fält som samlar in onödiga personuppgifter kan inte publiceras utan separat
            godkännande.
    - id: PLS-004
      name: Notifikations- och meddelandeleverans
      platform_id: PLT-024
      generations:
        G1:
          function_priority: Kritisk vid verksamhetskritiska aviseringar
          shared_platform_priority: Situationsberoende
          required_offering: Dokumenterade mottagare, sändkanal, retry och informationstyp; inga hemligheter i öppna
            meddelanden.
          verification: Uteblivet SMS/e-post syns i logg och kan hanteras manuellt utan förlorad affärshändelse.
        G2:
          function_priority: Kritisk vid verksamhetskritiska aviseringar
          shared_platform_priority: Viktig vid flera appar
          required_offering: Gemensamma kanalspecifika mallar, korrelation, kvittensstatus, felkoder och hantering
            av dubbletter.
          verification: Simulera leverantörsbortfall och duplicerad händelse; återförsök ger inte upprepade känsliga
            meddelanden.
        G3:
          function_priority: Kritisk vid verksamhetskritiska aviseringar
          shared_platform_priority: Viktig vid bred kanalanvändning
          required_offering: Självbetjänade godkända notifieringsprofiler, mall-/kanalversionering, preferenser,
            samtycken där relevant, kvoter och leveransstatistik.
          verification: Ett nytt team skickar testnotis via säker profil och kan se leveranskvittens och kostnad.
        G4:
          function_priority: Kritisk vid verksamhetskritiska aviseringar
          shared_platform_priority: Kritisk vid mycket bred automatisering
          required_offering: Agentutlösta notifieringar begränsas av mottagarkrets, ämne, sekretessklass, frekvens
            och åtgärdsmandat; avvikelse kan stoppas.
          verification: AI-agent försöker skicka massavisering till otillåten målgrupp och blockeras med spårbar
            orsak.
    - id: PLS-074
      name: Geospatial informations- och karttjänst
      platform_id: PLT-015
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Bra att ha
          required_offering: Enkla kartvyer och datakällor med källa, aktualitet, koordinatreferens och sekretesskontroll.
          verification: Kartan har textbaserat alternativ och anger datats ursprung och uppdateringstid.
        G2:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Dokumenterade geodatakontrakt, cache och lämpliga API:er för flera konsumenter; separat
            behörighet för skyddade lager.
          verification: Två appar visar samma geografiska objekt konsekvent när API-versionen ändras.
        G3:
          function_priority: Viktig vid många geoflöden
          shared_platform_priority: Viktig vid många geoflöden
          required_offering: Självbetjänade kart-/geokodningsprofiler med licens-/kostnadskontroll, SLO, tillgängliga
            textalternativ och datakvalitet.
          verification: Nytt team får godkänt kartlager med automatisk policykontroll och belastningstest.
        G4:
          function_priority: Viktig vid agentstödd geoverksamhet
          shared_platform_priority: Viktig vid stor geoportfölj
          required_offering: AI-baserad geoassistans visar osäkerhet och källor, begränsar åtkomst till känsliga
            positioner och kräver mänskligt beslut vid högriskåtgärd.
          verification: Agenten kan inte hämta skyddade koordinater eller fatta geobaserat myndighetsbeslut utan
            mandat.
    - id: PLS-089
      name: Mediedistribution och streaming
      platform_id: PLT-016
      generations:
        G1:
          function_priority: Situationsberoende
          shared_platform_priority: Bra att ha
          required_offering: Grundläggande åtkomstskydd, korrekt MIME, bild-/videotextalternativ och rimlig bandbreddsprofil.
          verification: Obehörig användare nekas media och hörbar information har relevant textalternativ.
        G2:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Kontrollerad distribution via cache eller CDN vid behov; token/URL-livstid, versionsändringar
            och mätning av uppspelningsfel.
          verification: Uppspelning kan fortsätta över en tillfällig kapacitetsvariation och åtkomstlänk upphör
            som planerat.
        G3:
          function_priority: Viktig vid omfattande medieflöden
          shared_platform_priority: Viktig vid stor medieportfölj
          required_offering: Självbetjänade distributionsprofiler, mätbar latency/kostnad, rättighetsvillkor, signerade
            länkar och tillgängliga textnings-/alternativspår.
          verification: Ny applikation använder standardprofil och kan verifiera kontroll av tillgänglighet och
            kostnad.
        G4:
          function_priority: Viktig vid omfattande medieflöden
          shared_platform_priority: Viktig vid stor medieportfölj
          required_offering: Styrd mediaåtkomst för genererade eller multimodala gränssnitt; tydlig markering av
            syntetiskt material där relevant och strikt skydd av privata länkar.
          verification: Ett AI-genererat mediaobjekt går inte att sprida till otillåten publik och dess status kan
            spåras.
    - id: PLS-075
      name: Mobil fältapplikationsgrund och offline-synkronisering
      platform_id: PLT-025
      generations:
        G1:
          function_priority: Kritisk om offline är verksamhetskrav
          shared_platform_priority: Situationsberoende
          required_offering: Lokala utkast, tydlig status för uppkoppling, skyddad datalagring och manuell kontrollerad
            uppladdning vid nätåtkomst.
          verification: Arbete under nätavbrott går att återuppta och skicka när anslutning återkommer utan datatapp.
        G2:
          function_priority: Kritisk om offline är verksamhetskrav
          shared_platform_priority: Viktig vid många fältappar
          required_offering: Idempotent synkronisering, versionsmärkt lokalt state, konfliktdetektion och återupptagning
            efter nätavbrott.
          verification: Samma ärende ändras offline på två enheter; konflikt synliggörs och löses enligt domänregel.
        G3:
          function_priority: Kritisk om offline är verksamhetskrav
          shared_platform_priority: Kritisk vid omfattande fältverksamhet
          required_offering: Självbetjänad offline-SDK/profil med krypterad cache, policy för datalivslängd, testverktyg
            för konflikter och telemetri.
          verification: Nytt team integrerar SDK och verifierar offline-/sync-profil via standardiserat nätavbrottstest.
        G4:
          function_priority: Kritisk om offline är verksamhetskrav
          shared_platform_priority: Kritisk vid omfattande fältverksamhet
          required_offering: Kontrollerad AI-assistans även vid intermittent nät; tydliga begränsningar för lokal
            modell-/datakopia och obligatorisk avstämning innan riskhandling.
          verification: Agentgenererat förslag offline kan inte automatiskt skriva över senare auktoritativt beslut
            online.
  CAP-IT-02:
    id: CAP-IT-02
    name: Process, workflow och ärendehantering
    source_file: cap-it-02/CAP-IT-02.yaml
    services:
    - id: PLS-005
      name: Workfloworkestrering
      platform_id: PLT-002
      generations:
        G1:
          function_priority: Viktig vid långlivade processer
          shared_platform_priority: Bra att ha
          required_offering: Beständig processstatus, timers, manuell återstart och transaktionsgränser kan implementeras
            i systemet; motorn är valfri.
          verification: Avbryt en instans under väntan, återstarta systemet och verifiera att steg varken förloras
            eller körs dubbelt.
        G2:
          function_priority: Kritisk vid tvärsystemprocesser
          shared_platform_priority: Viktig vid många flöden
          required_offering: Hållbar exekvering, korrelations-ID, timeout, idempotens, kompensation, versionshantering
            av körande instanser och översikt över hela flödet.
          verification: Bryt ett beroende mitt i processen; återuppta säkert, visa felpunkt och undvik dubbel extern
            bokning.
        G3:
          function_priority: Kritisk vid komplexa flöden
          shared_platform_priority: Kritisk vid bred återanvändning
          required_offering: Självbetjänad processruntime med standardiserade exekveringsprofiler, skalning, spårbarhet,
            rollback/migrering av definitioner och isolering mellan konsumenter.
          verification: Nytt team driftsätter processmall utan specialbeställning; automatiska tester täcker timeout
            och processversion under pågående instans.
        G4:
          function_priority: Kritisk vid agentstyrda affärsflöden
          shared_platform_priority: Kritisk vid bred verksamhetsautomation
          required_offering: Policybaserad exekvering för agentinitierade steg, separata mandat, mänsklig attest
            för högriskåtgärder, reproducerbar processhistorik och säker avbrytning.
          verification: Låt agent föreslå ändring av ett beslutskritiskt flöde; verifiera att publiceringsgrind
            stoppar ändring och att pågående instanser förblir spårbara.
    - id: PLS-006
      name: Case management-plattformstjänst
      platform_id: PLT-002
      generations:
        G1:
          function_priority: Kritisk där ärenden är kärnverksamhet
          shared_platform_priority: Situationsberoende
          required_offering: En stabil lokal ärendemodell med unik identitet, status, handläggarhistorik, sökbarhet
            och återupptagning.
          verification: Skapa, pausa, återöppna och avsluta ett ärende samt visa fullständig historik efter återställning.
        G2:
          function_priority: Kritisk vid distribuerad ärendehantering
          shared_platform_priority: Viktig vid flera ärendesystem
          required_offering: Korrelera ärendestatus över tjänster; historik, delegering, sammanslagning/uppdelning
            där behov finns och konsekvent hänvisning till dokument och beslut.
          verification: Byt handläggare och simulera avbrott i dokumenttjänst; ärendet ska vara sökbart och korrekt
            fortsättningsbart.
        G3:
          function_priority: Kritisk vid återkommande casebehov
          shared_platform_priority: Viktig vid stor caseportfölj
          required_offering: 'Versionerade generiska casebyggblock: tillstånd, milstolpar, auditspår, uppgiftsrelationer,
            dokumentreferenser och delad säkerhetsprofil.'
          verification: Ett nytt team bygger ett avgränsat ärendestöd med standard-API och kan migrera/återställa
            en instans utan informationsförlust.
        G4:
          function_priority: Kritisk där AI behandlar ärenden
          shared_platform_priority: Viktig vid bred verksamhetsutveckling
          required_offering: Maskinläsbar ärendekontext med dataminimering och behörighetskontroll, föreslagna nästa
            steg, spårbar agentmedverkan och mänskligt ansvar för beslut.
          verification: Agent föreslår åtgärd i skyddat ärende; test visar att otillåtna fält maskeras och beslut
            kräver rätt ansvarig attest.
    - id: PLS-007
      name: Human task och arbetskö
      platform_id: PLT-002
      generations:
        G1:
          function_priority: Viktig vid mänsklig handläggning
          shared_platform_priority: Bra att ha
          required_offering: Arbetslistor, tilldelning, slutförande och synlig status, med manuell prioritering
            och tydliga roller.
          verification: Uppgift tilldelas, omfördelas och slutförs utan att samma beslut fattas dubbelt.
        G2:
          function_priority: Kritisk vid många teamöverlämningar
          shared_platform_priority: Viktig vid flerkanalshandläggning
          required_offering: Samordnad uppgiftsidentitet, köpolicy, tidsfrister, eskalering, delegering och robust
            synk mellan flera system.
          verification: Handläggare tappar behörighet och uppgift omfördelas utan förlorad tidsfrist eller dubblett.
        G3:
          function_priority: Kritisk vid stora handläggningsflöden
          shared_platform_priority: Viktig vid många konsumenter
          required_offering: Självbetjänat task-API med köprofil, SLA, revisionsspår, standardiserad notifieringskoppling
            och integration med identitet.
          verification: Två oberoende appar konsumerar standardtjänsten och visar konsekvent deadline, ägare och
            historik.
        G4:
          function_priority: Kritisk vid AI-förslag till mänskliga beslut
          shared_platform_priority: Kritisk vid bred hybridautomation
          required_offering: Explicit separation av agentuppgift och mänsklig attest; tidbegränsade uppdrag, förklarbar
            prioritering, delegation och automatisk flaggning vid osäkerhet.
          verification: Försök slutföra attestkrävande uppgift via agent utan godkänt mandat; åtgärden blockeras,
            loggas och går till rätt handläggare.
    - id: PLS-004
      name: Notifikations- och meddelandeleverans
      platform_id: PLT-024
      generations:
        G1:
          function_priority: Viktig vid tidskritisk avisering
          shared_platform_priority: Situationsberoende
          required_offering: Skicka relevanta meddelanden, skydda innehåll, följa upp misslyckad leverans och ha
            manuella reservvägar.
          verification: Bryt e-postleverans; uppgift ska inte bli omöjlig att behandla och uteblivet meddelande
            kan upptäckas.
        G2:
          function_priority: Kritisk vid tidskritiska tvärsystemflöden
          shared_platform_priority: Viktig vid många applikationer
          required_offering: Händelsekorrelation, återförsök, leveransstatus, idempotens, mallversion och säker
            kanalval kopplat till processstatus.
          verification: Simulera dubbletthändelse och leverantörsavbrott; mottagaren får inte upprepade felaktiga
            aviseringar.
        G3:
          function_priority: Kritisk när avisering krävs
          shared_platform_priority: Viktig vid bred användning
          required_offering: Självbetjänade aviseringsprofiler, mottagarpreferenser, kanalpolicy, mallar, kvoter,
            spårbarhet, åtkomststyrning och uppföljning av leveransutfall.
          verification: Nytt team skapar testavisering via standard-API, kan följa status och hantera leveransfel
            utan specialintegration.
        G4:
          function_priority: Kritisk vid agentbaserad extern avisering
          shared_platform_priority: Viktig vid bred agentanvändning
          required_offering: 'Policy på agentinitierade utskick: syfte, mottagare, innehåll, klassning, frekvens
            och mänskligt godkännande när konsekvensen är hög.'
          verification: Låt agent försöka avisera otillåten mottagargrupp; blockera och auditera försöket och återgå
            till mänsklig granskning.
  CAP-IT-03:
    id: CAP-IT-03
    name: Regler och beslut
    source_file: cap-it-03/CAP-IT-03.yaml
    services:
    - id: PLS-008
      name: Besluts- och regelkörning
      platform_id: PLT-002
      generations:
        G1:
          function_priority: Kritisk för regelstyrda verksamhetsbeslut; annars situationsberoende
          shared_platform_priority: Bra att ha
          required_offering: Reproducerbara och dokumenterade beslut med tydliga indata, utdata, regler, giltighetsdatum
            och felsvar; lokal kod eller tabell kan räcka.
          verification: Återspela ett tidigare ärende mot rätt historisk regelversion och få identiskt beslut.
        G2:
          function_priority: Kritisk vid tvärsystem- och rättsverkande beslut
          shared_platform_priority: Viktig vid flera konsumenter
          required_offering: Separera regel-API från intern implementation; explicit datakontrakt, giltighetstid,
            idempotenta anrop där relevant, regelversion och beslutskorrelation.
          verification: Kör två regelversioner parallellt för äldre/ny klient, verifiera korrekta utfall samt spårbara
            avvikelser.
        G3:
          function_priority: Kritisk vid omfattande regelåteranvändning
          shared_platform_priority: Viktig vid många regelportföljer
          required_offering: Självbetjänad runtime med versionspinning, isolerade beslutsdefinitioner, godkänd dataåtkomst,
            telemetri, säker rollback och definierad driftsprofil.
          verification: Nytt team driftsätter versionerad regel utan manuell infrastrukturbeställning; rollback
            påverkar inte avslutade besluts revisionsspår.
        G4:
          function_priority: Kritisk vid AI-initierade regelstyrda handlingar
          shared_platform_priority: Viktig vid bred verksamhetsautomation
          required_offering: AI-förslag får endast aktiveras via explicit attest, deterministisk regelkörning, tillåten
            verktygsåtkomst och spårbar proveniens för regel/indata/beslut.
          verification: Agent försöker publicera ny regel och fatta beslut; stoppa utan rätt behörighet, simulera
            effekten och återge hela beslutshistoriken.
    - id: PLS-009
      name: Beslutsmodellering och simulering
      platform_id: PLT-002
      generations:
        G1:
          function_priority: Viktig för omfattande/rättskänsliga regelverk
          shared_platform_priority: Situationsberoende
          required_offering: Spårbar specifikation, beslutstabeller och testfall; kalkylark eller dokument kan fungera
            om styrning och versionshistorik finns.
          verification: Testa likvärdiga, motstridiga och gränsnära indata; dokumentera vem som godkänt utfallet.
        G2:
          function_priority: Viktig för regelverk som delas av flera tjänster
          shared_platform_priority: Viktig vid delat beslutsbehov
          required_offering: Formella regler och versionerade testuppsättningar för flera konsumenter, beslutstabeller,
            täckningsanalys och konsekvensjämförelse mellan versioner.
          verification: Jämför gamla och nya beslut för en representativ testkorpus och rapportera alla ändrade
            utfall.
        G3:
          function_priority: Viktig vid föränderliga regelportföljer
          shared_platform_priority: Viktig vid återkommande modellbehov
          required_offering: Självbetjänad modelleringsmiljö med återanvändbara mallar, simulering, versionsdiff,
            semantisk validering, tester, attester och publiceringsgrindar.
          verification: Visa täckningsrapport och simulerad effekt före godkännande, därefter jämför resultat efter
            införande.
        G4:
          function_priority: Kritisk för omfattande AI-assisterade regeländringar
          shared_platform_priority: Viktig vid utbredd verksamhetssjälvständighet
          required_offering: AI kan skapa modellutkast och testfall men dessa måste valideras syntaktiskt och semantiskt;
            utför kontrafaktisk simulering, bias- och konsekvenstester samt spårbar manuell attest.
          verification: 'Be AI föreslå en ny beslutsregel: hitta överlapp, saknade fall och oavsiktlig effekt på
            olika grupper; neka automatisk publicering.'
