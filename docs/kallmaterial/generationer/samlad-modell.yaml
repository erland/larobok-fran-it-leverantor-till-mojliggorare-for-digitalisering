        G3:
          function_priority: Situationsberoende
          shared_platform_priority: Situationsberoende
          required_offering: Standardprofil med behörighetsfilter, schemaändring och avgränsad querykostnad.
          verification: En gränsöverskridande fråga avvisas utan dataexponering.
        G4:
          function_priority: Situationsberoende
          shared_platform_priority: Viktig
          required_offering: Kunskapsgrafer får versionerad proveniens och relationell behörighetsfiltrering för
            AI.
          verification: AI kan inte använda skyddade relationer för att indirekt avslöja känsliga objekt.
    - id: PLS-010
      name: Förvaltad relationsdatabas
