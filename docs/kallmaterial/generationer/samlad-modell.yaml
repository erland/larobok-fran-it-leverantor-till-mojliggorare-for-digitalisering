            och förhindrande av överdelning.
          verification: Agentförsök att exfiltrera känsliga testuppgifter via prompt/verktyg stoppas och går att
            utreda.
    - id: PLS-052
      name: Kryptografisk nyckel- och HSM-tjänst
      platform_id: PLT-026
      generations:
        G1:
          function_priority: Kritisk
          shared_platform_priority: Situationsberoende
          required_offering: Dokumenterad nyckelförvaring, åtkomst och återställning för skyddsvärda system.
