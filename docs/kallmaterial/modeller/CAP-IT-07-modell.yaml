analysprinciper:
  tolkning_av_generationskrav: Generationsprofiler är analytiska scenarier, inte universella krav eller mognadscertifiering.
  kritikalitet: Funktionsbehov, behov av central tjänst och tillämplighet bedöms separat.
  aterkallelse: Skilj ny autentisering, existerande sessioner, giltiga token och systemlokala rättigheter; verifiera
    faktisk effekt.
  agentdelegering: Spårbar körning, mandat och resursnära kontroll krävs; separat kontoform är inte alltid obligatorisk.
  atgardsval:
  - behåll
  - komplettera
  - ändra arbetssätt och ansvar
  - ersätt efter verifierad produktbegränsning
