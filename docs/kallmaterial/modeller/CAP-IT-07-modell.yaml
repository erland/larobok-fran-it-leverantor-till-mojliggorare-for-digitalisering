metadata:
  id: CAP-IT-07
  titel: Identitet och tillit
  version: '2.0'
  datum: '2026-11-07'
  utgangspunkt: G2
  status: Kritiskt reviderat faktaboksunderlag; ej extern sakgranskning
  modellbaseline: v1.1
kallavgransning:
  ursprung:
  - Från systemdrift till digital självständighet
  - Förmågeöversikt – tekniska IT-förmågor CAP-IT-07
  - Plattformsöversikt – konceptuella plattformar baseline v1.1
  externa:
  - namn: NIST SP 800-63-4
    url: https://csrc.nist.gov/pubs/sp/800/63/4/final
    omfattning: Mänsklig identitet, autentisering och federation
  - namn: NIST SP 800-207
    url: https://csrc.nist.gov/pubs/sp/800/207/final
    omfattning: Zero Trust-principer
  - namn: OWASP Non-Human Identities Top 10 2025
    url: https://owasp.github.io/www-project-non-human-identities-top-10/2025/top-10-2025/
    omfattning: Risker för icke-mänskliga identiteter
  - namn: RFC 9700 (2025)
    url: https://www.rfc-editor.org/rfc/rfc9700
    omfattning: OAuth 2.0-säkerhet för klienter och resursservrar
  analytiskt: Alla generationsindikatorer, prioriteringar, teknikvarningar, prov och åtgärdsval är rekommendationer.
definition: Etablera och förvalta digitala identiteter samt explicita, begränsade och avvecklingsbara tillitsrelationer
  och tekniska underlag för auktorisation.
avgransning: Domänens behörighetssemantik och skyddad resurs ägs nära verksamhetssystemet; central tjänst får stödja
  besluten men inte överta domänägarskapet.
generationer:
  G1:
    roll: Kort historisk tillbakablick
    stod: Systemnära användar- och administrationsidentiteter med tydlig behörighetskontroll.
    fungerande_stod:
    - Åtkomst kan begränsas och avslutas
    - Administrativa konton har ägare
    teknikvarningar:
    - Osupporterade autentiseringskomponenter
    - Delade konton utan spårbarhet
  G2:
    roll: Nulägesdiagnos och huvudperspektiv
    stod: Federerad mänsklig identitet, separata tekniska identiteter, token- och tillitshantering samt resursnära
      auktorisation.
    behovsindikatorer:
    - Många samverkande tjänster
    - Människor och tjänster med åtkomst över flera system
    - Externa partners eller varierande privilegier
    fungerande_stod:
    - Korrekt autentiserad aktör med otillräcklig rätt nekas
    - Avslut slår igenom enligt riskbaserat mål
    - Tekniska identiteter har ägare och kan återkallas
    - Rotation av certifikat och hemligheter fungerar
    generationsarv:
    - Delade servicekonton
    - Manuella lokala behörighetslistor
    - Långlivade hemligheter och certifikat utan ägare
    teknikvarningar:
    - Otillräcklig federationsfunktion
    - Ingen säker rotation eller avveckling
    - Ohanterligt växande manuellt arbete
    - Utvecklarkopplingar till produktspecifik behörighetsmodell
    forbattringsspar:
      A: Åtgärda autentiserings-, behörighets- och tillitsbrister i den distribuerade miljön
      B: Gör återkommande livscykelärenden standardiserade och automatiserbara
    diagnostiskt_prov:
    - Stäng ett verkligt uppdrag och följ effekter i identitetskälla, katalog och två skyddade resurser
    - Skilj spärr av nya inloggningar från existerande token och sessioner
    - Rotera ett certifikat och dokumentera påverkan på beroende tjänster
  G3:
    roll: Förvaltade, självbetjänade erbjudanden
    stod: Standardprofiler för inloggning, workloadidentitet, certifikat, hemligheter och privilegier; automatiserad
      skapning, ändring och avveckling.
    behovsindikatorer:
    - Många likartade identitetsbehov
    - Långa väntetider på onboarding och rotation
    fungerande_stod:
    - Nya tjänster får godkända identitetsprofiler via standardväg
    - Rotation och avveckling är mätbar och prövad
    - Policy och undantag kan spåras
    teknikvarningar:
    - Portal över manuell ärendekö
    - Inga tillförlitliga livscykelgränssnitt
    - Central motor tar över verksamhetens behörighetssemantik
  G4:
    roll: Framåtblickande verksamhets- och AI-användning
    stod: Identifierbara agentkörningar, avgränsad delegering och resursnära kontroll, med kortlivade behörighetsbevis
      när lämpligt.
    behovsindikatorer:
    - AI-agenter agerar i verksamhetssystem
    - Kortlivade verksamhetslösningar och automatiseringar
    fungerande_stod:
    - En agentkörning kan bara utföra åtgärder som dess uttryckliga mandat medger
    - Återkallelse testas separat för nya anrop och existerande token/sessioner
    - Uppdragsgivare, körning, verktygsanrop och skyddad resurs kan följas där kontrollen kräver det
    teknikvarningar:
    - Agenten får breda användarrättigheter utan separat mandatkontroll
    - Ingen testad modell för begränsning eller återkallelse
    - Permanenta nycklar används för kortlivade uppdrag
overgangar:
  G1_G2:
    syfte: Igenkänning av kvarvarande generationsarv, inte en fullständig historisk implementationsplan
  G2_G3:
    syfte: Från projektspecifik tillit till standardiserade och förvaltade livscykeltjänster
    beredskapsindikatorer:
    - Inventerade ägare och beroenden
    - Testade standardprofiler
    - Mätbara ledtider och manuell belastning
    - Produktägarskap och säker undantagshantering
    - Säkra återkallelse- och tokenlivscykler har testats i representativa konsumenter
  G3_G4:
    syfte: Från tillit för människa och tjänst till kontrollerad agentdelegering
    beredskapsindikatorer:
    - Tydlig verkställighet av rättigheter vid resursen
    - Spårbar uppdrags- och agentägare
    - Tidsbegränsade credentials och effektiv återkallelse
    - Delegering kan begränsas per uppdrag utan att förutsätta separat kontotyp för varje agent
plattformstjanster:
- id: PLS-025
  namn: Autentisering och federation
  plattform:
    id: PLT-006
    namn: Identitets- och åtkomstplattform
  grunduppdrag_enligt_kallmodell: Autentisering, federation och tokenbaserad identitetsförmedling
  tillamplighet: Mänsklig autentisering där den krävs; anonym publik åtkomst kan vara tillåten
  generationer:
    G1:
      funktionellt_stod: Autentisering, tillitskedja och federationskopplingar hanteras som dokumenterade kontrakt.
      funktionsprioritet_i_tillampligt_fall: Kritisk för relevant identitet/åtkomst med proportionerliga krav
      gemensam_plattform_i_tillampligt_fall: Situationsberoende till viktig
      verifieringsprov: Kontrollera ägarskap, faktisk behörighetskontroll och möjlighet att avsluta tillgång.
      kalltyp: Analytisk generationsbedömning, inte direkt krav från källmodellen
    G2:
      funktionellt_stod: Användare från flera kanaler och organisationer måste logga in och använda federerade identiteter.
      funktionsprioritet_i_tillampligt_fall: Kritisk för relevant identitet/åtkomst med proportionerliga krav
      gemensam_plattform_i_tillampligt_fall: Situationsberoende till viktig
      verifieringsprov: Testa ogiltig utfärdare, mottagare och spärrad användare; mät separat nya anrop och befintliga
        sessioner.
      kalltyp: Analytisk generationsbedömning, inte direkt krav från källmodellen
    G3:
      funktionellt_stod: Identitetsfederation ges med standardprofiler, versionshanterade integrationer och mätbar
        avveckling.
      funktionsprioritet_i_tillampligt_fall: Kritisk för relevant identitet/åtkomst med proportionerliga krav
      gemensam_plattform_i_tillampligt_fall: Viktig vid återkommande behov; kan även vara externt hanterad
      verifieringsprov: Testa ogiltig utfärdare, mottagare och spärrad användare; mät separat nya anrop och befintliga
        sessioner.
      kalltyp: Analytisk generationsbedömning, inte direkt krav från källmodellen
    G4:
      funktionellt_stod: Även verksamhetsnära appar och agentinitierade flöden behöver korrekt användaridentitet;
        användarens autentisering innebär inte obegränsad agentdelegation.
      funktionsprioritet_i_tillampligt_fall: Kritisk för relevant identitet/åtkomst med proportionerliga krav
      gemensam_plattform_i_tillampligt_fall: Viktig vid återkommande behov; kan även vara externt hanterad
      verifieringsprov: Testa ogiltig utfärdare, mottagare och spärrad användare; mät separat nya anrop och befintliga
        sessioner.
      kalltyp: Analytisk generationsbedömning, inte direkt krav från källmodellen
  varningssignal: En central inloggning löser inte domänbehörighet. Ett delat sessionslager kan också bli en gemensam
    felkälla.
  beroenden:
  - CAP-IT-11
  - CAP-IT-12
- id: PLS-085
