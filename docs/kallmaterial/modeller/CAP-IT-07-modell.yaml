    G1:
      funktionellt_stod: Varje system verkställer kontroller vid skyddade resurser; central beslutsmotor är valfri.
      funktionsprioritet_i_tillampligt_fall: Kritisk kontroll i tillämpligt system; gemensam beslutsmotor inte obligatorisk
      gemensam_plattform_i_tillampligt_fall: Situationsberoende; viktig vid många återkommande policybehov
      verifieringsprov: Kontrollera ägarskap, faktisk behörighetskontroll och möjlighet att avsluta tillgång.
      kalltyp: Analytisk generationsbedömning, inte direkt krav från källmodellen
    G2:
