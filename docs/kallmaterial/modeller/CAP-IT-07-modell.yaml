    namn: Identitets- och åtkomstplattform
  grunduppdrag_enligt_kallmodell: Teknikneutral katalog av identiteter, attribut, grupper och katalogrelationer
  tillamplighet: Anställda, konsulter och andra identitetskategorier
  generationer:
    G1:
      funktionellt_stod: Systemnära kataloger och synkronisering behöver definierade källor och felhantering.
      funktionsprioritet_i_tillampligt_fall: Kritisk när tjänstens säkerhetsbehov är tillämpligt
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      verifieringsprov: Kontrollera ägarskap, faktisk behörighetskontroll och möjlighet att avsluta tillgång.
      kalltyp: Analytisk generationsbedömning, inte direkt krav från källmodellen
    G2:
      funktionellt_stod: Många tjänster behöver konsekventa uppgifter om personer, grupper och organisatoriska relationer.
      funktionsprioritet_i_tillampligt_fall: Kritisk när tjänstens säkerhetsbehov är tillämpligt
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      verifieringsprov: Byt en persons enhet eller avsluta ett uppdrag och kontrollera lagg, felhantering och kvarvarande
        åtkomst.
      kalltyp: Analytisk generationsbedömning, inte direkt krav från källmodellen
    G3:
      funktionellt_stod: Standardiserade kataloggränssnitt, tydlig källhierarki och automatiserad synk/avveckling.
      funktionsprioritet_i_tillampligt_fall: Kritisk när tjänstens säkerhetsbehov är tillämpligt
      gemensam_plattform_i_tillampligt_fall: Viktig vid återkommande behov, annars situationsberoende
      verifieringsprov: Byt en persons enhet eller avsluta ett uppdrag och kontrollera lagg, felhantering och kvarvarande
        åtkomst.
      kalltyp: Analytisk generationsbedömning, inte direkt krav från källmodellen
    G4:
      funktionellt_stod: Fler verktyg och agenter behöver korrekta attribut med tydlig proveniens och aktualitet.
      funktionsprioritet_i_tillampligt_fall: Kritisk när tjänstens säkerhetsbehov är tillämpligt
      gemensam_plattform_i_tillampligt_fall: Viktig vid återkommande behov, annars situationsberoende
      verifieringsprov: Byt en persons enhet eller avsluta ett uppdrag och kontrollera lagg, felhantering och kvarvarande
