  krav_och_informationsansvar: Är auktoritativ källa, tidskrav och tillåten användning avtalade?
  arkitektur_och_integration: Beror felet på kopior, kontrakt, migrationsordning eller konsistens?
  implementation_och_forvaltning: Kan befintlig teknik klara kravet efter rimlig konfiguration, integration eller uppgradering?
  produktbegransning: Finns en verifierad funktionell, säkerhetsmässig, support- eller kostnadsgräns som kräver förändrat
    produktval?
  beslutsalternativ:
  - behåll
  - komplettera
  - ändra användning eller ansvar
  - ersätt
