metadata:
  id: CAP-IT-04
  titel: Datahantering och informationslagring
  typ: faktaboksunderlag
  version: '2.0'
  datum: '2026-11-07'
  utgangspunkt: G2
  modellbaseline: v1.1
  status: Kritiskt internreviderad; extern sakkunnig- och juridisk granskning återstår
kallavgransning:
  ursprung:
  - Från systemdrift till digital självständighet
  - Förmågeöversikt – tekniska IT-förmågor CAP-IT-04
  - Plattformsöversikt – konceptuella plattformar v1.1
  externt:
  - NIST SP 800-209 (2020) – fastställd publikation
  - NIST SP 800-209 Rev. 1 (2026) – endast utkast, inte gällande standard
  - CNCF Platform Engineering Maturity (2026)
  analytiskt: Generationskrav, prioritet, verifieringsprov och förändringsindikatorer är tolkningar för en generisk organisation,
    inte obligatoriska normkrav.
definition: Realisera informationens tekniska behov och livscykel genom lämplig lagring, konsistens, historik, kopior,
  retention, återställningsbarhet och förändringsförmåga.
avgransning: Verksamhetens semantiska informationsägarskap och auktoritativ källa ligger utanför; operativ backup, restoretest
  och disaster recovery primärt CAP-IT-09.
generationer:
  G1:
    roll: Kort historisk bakgrund
    stod: Förvaltade databaser och lagring för sammanhållna system, med kända krav på dataansvar och livscykel.
    behovsindikatorer:
    - Beständig verksamhetsinformation
    - Konsistens och historik utifrån verksamhetskrav
    fungerande_stod:
    - Källa och dataansvar är dokumenterade
    - Databasens livscykel och återställningsberoenden är kända
    teknikvarningar:
    - Utgången support eller ouppfyllt konsistenskrav
    - Manuella rutiner utan testbar återställbarhet
  G2:
    roll: Huvudperspektiv – diagnostik av distribuerad data
    stod: Tydliga datagränser, auktoritativa källor, versionshanterade kontrakt, konsistens- och kopiehantering.
    behovsindikatorer:
    - Flera självständiga tjänster
    - Överlappande datakopior och analysbehov
    - Strikta kvalitets- eller bevarandekrav
    fungerande_stod:
    - Ägarskap, källa och fördröjning kan fastställas för representativ information
    - Schemaändring kan provas med kända konsumenter
    - Dubletter, fördröjning och radering hanteras utan tyst dataförlust
    - Aktualitet, konsistens och RPO/RTO för det kritiska informationsflödet har olika verifierade mål
    - Gallring och fortsatt användningsförbud kan följas genom primärdata, kopior, index och återläsning
    teknikvarningar:
    - Otillräckliga konsistensegenskaper eller prestanda för verkliga krav
    - Saknar säkra ändrings- och exportvägar
    - Teknik som inte längre säkerhetsunderhålls
    - Antagande att en kod-rollback också återställer data eller en externt publicerad händelse
    generationsarv:
    - Direktåtkomst till andra tjänsters datatabeller
    - Oklara auktoritativa källor
    - Manuella schemaändringar och oinventerade kopior
    forbattringsspar:
      A: Åtgärda brister i datagränser, kvalitet, ansvar och återställningsberoenden
      B: Automatisera återkommande dataerbjudanden när de har dokumenterad efterfrågan
  G3:
    roll: Standardiserade, förvaltade dataerbjudanden
    stod: Självbetjänade och livscykelhanterade teknikprofiler med säkerhet, kapacitetskontroll, kostnadsansvar och undantag.
    behovsindikatorer:
    - Många team med likartade dataönskemål
    - Hög belastning från återkommande manuella beställningar
    fungerande_stod:
    - Standarddatatjänst kan skapas, ändras och avvecklas av konsument enligt policy
    - Uppgradering och hantering av undantag kan demonstreras
    - Informationsägarskap och tekniskt plattformsansvar är åtskilda
    - Kompatibel schemaförändring, framåträttning och återställning prövas för representativ datatjänst
    teknikvarningar:
    - Portal som döljer manuella godkännandekedjor
    - Inga hållbara schema-/versionsuppgraderingar
    - Katalog av tjänster utan förvaltning, kostnadskontroll och användning
  G4:
    roll: Framåtblickande riskstyrd datakonsumtion
    stod: Ändamålsbegränsad och spårbar dataåtkomst även för verksamhetsutvecklade AI-arbetsflöden, med skyddade kopior
      och livscykel.
    behovsindikatorer:
    - AI-stödda eller verksamhetsutvecklade lösningar som konsumerar verksamhetsdata
    - Ökad risk för okontrollerade datauttag eller kopior
    fungerande_stod:
    - Otillåtna datauttag nekas vid betrodda kontrollpunkter
    - Källversion och databegränsning kan följas
    - Temporära bearbetningsytor kan identifieras och avvecklas
    - Återkallad åtkomst prövas med kända tokenlivslängder och kvarvarande exporterade kopior
    - Källhänvisning till ett AI-svar kontrolleras separat från svarets faktiska korrekthet
    teknikvarningar:
    - AI-index eller kopior saknar åtkomst- och raderingsmodell
    - Ingen teknisk återkallelse av nya läsningar
    - Katalogpost förväxlas med kvalitets- eller behörighetsgaranti
overgangar:
  G1_G2:
    syfte: Kort historisk förklaring av distribuerade datagränser och kvarvarande generationsarv
  G2_G3:
    syfte: Göra repetitiva dataerbjudanden självbetjänade först när funktionell datagrund fungerar
    beredskap:
    - Fastställda datakällor och konsumentansvar
    - Repetitiva och standardiserbara behov
    - Automatiserad provisionering och avveckling
    - Kapacitet för långsiktigt produktansvar
  G3_G4:
    syfte: Kontrollerbar dataanvändning av fler utvecklare och agenter
    beredskap:
    - Ändamålsstyrd åtkomst och bekräftade dataägare
    - Trovärdig metadata och kvalitet
    - Verifierbar återkallelse av ny åtkomst
    - Avveckling av temporära kopior
prioritetsprincip: Bedöm först om tjänstens funktion behövs i det konkreta användningsfallet och hur stora konsekvenser
  ett fel får; bedöm därefter om ett gemensamt förvaltat erbjudande lönar sig. Ingen prioritet är automatiskt stigande
  med generationen.
plattformstjanster:
- id: PLS-064
  namn: Analytisk datahantering
  plattform:
    id: PLT-020
    name: Analytisk data- och data engineering-plattform
  tillamplighet: När historisk och fler-källebearbetad analys krävs
  grunduppdrag_enligt_kallmodell: Analytisk lagring och bearbetning för stora historiska datamängder; skild från federerad
    källåtkomst.
  generationer:
    G1:
      funktionellt_stod: Separata rapportdatabaser eller periodiska utdrag med dokumenterad uppdatering och avstämning.
      funktionsprioritet_i_tillampligt_fall: Viktig
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Manuell beställning och specialisthanterad drift; lokala modeller och återställningsplaner.
      verifieringsprov: En historisk fråga kan reproduceras mot ett fastställt utdrag.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
    G2:
      funktionellt_stod: Separat analytisk lagring med styrda inläsningar, partitionering och kapacitetsplanering för
        många källor.
      funktionsprioritet_i_tillampligt_fall: Viktig
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Gemensamma tekniska komponenter men många tjänstespecifika anpassningar och beställningar.
      verifieringsprov: Käll-till-rapport-avstämning visar saknade eller dubbla perioder.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
    G3:
      funktionellt_stod: Förvaltade warehouse-/lakehouse-profiler med katalog, åtkomstpolicy, kostnadsgränser och reproducerbara
        miljöer.
      funktionsprioritet_i_tillampligt_fall: 'Kravstyrd: kritisk endast när verksamhetskonsekvensen motiverar det'
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Självbetjänade databas-/lagringsprofiler, policy-as-code, versionering och datakatalog där relevant.
      verifieringsprov: Team skapar godkänd analysmiljö och genomför återställning av en felaktig laddning.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
    G4:
      funktionellt_stod: Policybegränsade analysytor för AI med definierad härkomst, dataavgränsning och spårbara kopior.
      funktionsprioritet_i_tillampligt_fall: 'Kravstyrd: kritisk endast när verksamhetskonsekvensen motiverar det'
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Riskklassade, kortlivade och ändamålsbegränsade dataerbjudanden med maskinellt verkställda begränsningar.
      verifieringsprov: AI-arbetsflöde nekas data utanför godkänt ändamål och resultat kan härledas till versionsmärkt
        dataset.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
  diagnostisk_fraga: Vilket konkret informationsbehov motiverar analytisk datahantering, och kan det lösas med befintliga
    förvaltade tjänster?
  beroenden:
  - CAP-IT-07
  - CAP-IT-09
  - CAP-IT-12
- id: PLS-065
  namn: Dataflöden och datapipelines
  plattform:
    id: PLT-020
    name: Analytisk data- och data engineering-plattform
  tillamplighet: När återkommande analytiska dataflöden behöver styras
  grunduppdrag_enligt_kallmodell: Kontrollerad ingestion, transformation och dataförflyttning för data/analys; inte transaktionell
    integration.
  generationer:
    G1:
      funktionellt_stod: Schemalagda ETL-jobb med felrapportering och dokumenterad fältmappning.
      funktionsprioritet_i_tillampligt_fall: Viktig
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Manuell beställning och specialisthanterad drift; lokala modeller och återställningsplaner.
      verifieringsprov: Felaktigt källdata stoppas eller flaggas, inte tyst överhoppas.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
    G2:
      funktionellt_stod: Idempotenta pipelines, versionsstyrda scheman och återkörning vid delvis misslyckad inläsning.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Gemensamma tekniska komponenter men många tjänstespecifika anpassningar och beställningar.
      verifieringsprov: Samma batch körs två gånger utan att dubblera resultat.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      prioritet_forklaring: Kritisk endast om tjänstens faktiska verksamhetsfall har kritiska konsekvenser; generationsnivå
        ger inte i sig denna prioritet.
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
    G3:
      funktionellt_stod: Mallbaserade, testade pipelineprofiler med katalogregistrering, policykontroll och lineage som
        standard.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Självbetjänade databas-/lagringsprofiler, policy-as-code, versionering och datakatalog där relevant.
      verifieringsprov: Ny pipeline skapas utan manuellt specialbygge och ger fullständig körningsspårning.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      prioritet_forklaring: Kritisk endast om tjänstens faktiska verksamhetsfall har kritiska konsekvenser; generationsnivå
        ger inte i sig denna prioritet.
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
    G4:
      funktionellt_stod: Tydliga datakontrakt och kvalitetsspärrar även för AI-ingestion, embedding- och uppdateringsflöden.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Riskklassade, kortlivade och ändamålsbegränsade dataerbjudanden med maskinellt verkställda begränsningar.
      verifieringsprov: En otillåten källa blockeras före ny index-/modelluppdatering; en felaktig körning kan isoleras
        och rättas med dokumenterad omkörnings- eller kompenseringsstrategi.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      prioritet_forklaring: Kritisk endast om tjänstens faktiska verksamhetsfall har kritiska konsekvenser; generationsnivå
        ger inte i sig denna prioritet.
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
  diagnostisk_fraga: Vilket konkret informationsbehov motiverar dataflöden och datapipelines, och kan det lösas med befintliga
    förvaltade tjänster?
  beroenden:
  - CAP-IT-07
  - CAP-IT-09
  - CAP-IT-12
- id: PLS-098
  namn: Semantiskt data- och måttlager
  plattform:
    id: PLT-013
    name: BI- och semantikplattform
  tillamplighet: När många analyser behöver gemensamma mått och definitioner
  grunduppdrag_enligt_kallmodell: Delade semantiska data-/måttmodeller; verksamheten äger definitionerna.
  generationer:
    G1:
      funktionellt_stod: Lokalt definierade begrepp och beräkningsregler dokumenteras i rapporter.
      funktionsprioritet_i_tillampligt_fall: Situationsberoende
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Manuell beställning och specialisthanterad drift; lokala modeller och återställningsplaner.
      verifieringsprov: Två rapporter kan förklara varför samma mått skiljer sig.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
    G2:
      funktionellt_stod: Gemensamma versionsstyrda mått prioriteras för tvärfunktionella analyser.
      funktionsprioritet_i_tillampligt_fall: Viktig
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Gemensamma tekniska komponenter men många tjänstespecifika anpassningar och beställningar.
      verifieringsprov: Ändrad måttdefinition får tydlig påverkan och godkännande.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
    G3:
      funktionellt_stod: Publicerade måttkontrakt med återanvändbar API-/BI-konsumtion, roller och versionshantering.
      funktionsprioritet_i_tillampligt_fall: Viktig
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Självbetjänade databas-/lagringsprofiler, policy-as-code, versionering och datakatalog där relevant.
      verifieringsprov: Två verktyg returnerar identiskt mått för samma avgränsning.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
    G4:
      funktionellt_stod: AI-agenter använder samma godkända mått och begreppsdefinitioner som mänskliga analytiker.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Riskklassade, kortlivade och ändamålsbegränsade dataerbjudanden med maskinellt verkställda begränsningar.
      verifieringsprov: Ett AI-arbetsflöde kan inte ändra publicerad definition av ett styrande mått utan godkännande;
        alternativa beräkningar märks som sådana.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      prioritet_forklaring: Kritisk endast om tjänstens faktiska verksamhetsfall har kritiska konsekvenser; generationsnivå
        ger inte i sig denna prioritet.
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
  diagnostisk_fraga: Vilket konkret informationsbehov motiverar semantiskt data- och måttlager, och kan det lösas med
    befintliga förvaltade tjänster?
  beroenden:
  - CAP-IT-07
  - CAP-IT-09
  - CAP-IT-12
- id: PLS-066
  namn: Datakatalog, metadata och lineage
  plattform:
    id: PLT-021
    name: Data governance- och kvalitetsplattform
  tillamplighet: När dataset och dataflöden behöver kunna hittas, förstås och spåras
  grunduppdrag_enligt_kallmodell: Teknisk metadata, dataset discovery och lineage; länkar till dataägarskap.
  generationer:
    G1:
      funktionellt_stod: En inventering av viktiga datakällor med ägare, retention och beroenden.
      funktionsprioritet_i_tillampligt_fall: Bra att ha
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Manuell beställning och specialisthanterad drift; lokala modeller och återställningsplaner.
      verifieringsprov: Ansvarig och primär källa hittas för ett kritiskt dataset.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
    G2:
      funktionellt_stod: Gemensamma metadata och manuellt kompletterad härkomst över centrala dataflöden.
      funktionsprioritet_i_tillampligt_fall: Viktig
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Gemensamma tekniska komponenter men många tjänstespecifika anpassningar och beställningar.
      verifieringsprov: Påverkade rapporter kan identifieras vid en ändring i källschema.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
    G3:
      funktionellt_stod: Automatiserad metadatafångst, sökning, klassningskoppling och lineage i plattformens standardflöden.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig vid återkommande behov; annars situationsberoende
      leveransform: Självbetjänade databas-/lagringsprofiler, policy-as-code, versionering och datakatalog där relevant.
      verifieringsprov: Ny datatjänst dyker upp i katalog med ägare och relationer utan separat beställning.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      prioritet_forklaring: Kritisk endast om tjänstens faktiska verksamhetsfall har kritiska konsekvenser; generationsnivå
        ger inte i sig denna prioritet.
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
    G4:
      funktionellt_stod: Maskinläsbar proveniens för AI-konsumtion, beslutsunderlag och åtkomstbeslut.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig vid återkommande behov; annars situationsberoende
      leveransform: Riskklassade, kortlivade och ändamålsbegränsade dataerbjudanden med maskinellt verkställda begränsningar.
      verifieringsprov: Ett AI-svars hämtade underlag kan spåras till käll- och datasetversion; svarsinnehållets korrekthet
        testas separat.
      bedomningstyp: arkitekturbedomning, situationsanpassad
      prioritet_forklaring: Kritisk endast om tjänstens faktiska verksamhetsfall har kritiska konsekvenser; generationsnivå
        ger inte i sig denna prioritet.
      kallstatus: Analytisk arkitekturbedömning; inte normativt krav i källmodellen
  diagnostisk_fraga: Vilket konkret informationsbehov motiverar datakatalog, metadata och lineage, och kan det lösas
    med befintliga förvaltade tjänster?
  beroenden:
