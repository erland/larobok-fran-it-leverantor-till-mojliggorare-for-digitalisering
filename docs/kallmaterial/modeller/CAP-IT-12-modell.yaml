    assessment: Verifiera tillämplighet och risk innan gemensam tjänst etableras eller befintlig teknik ersätts.
- id: PLS-053
  name: Tekniska säkerhetsguardrails och policy enforcement
  platform:
    id: PLT-009
    name: Utvecklings- och leveransplattform
  source_mission_summary: Maskinellt verkställda säkerhetsregler i plattform och leverans; organisatorisk policy
    och riskägarskap ligger utanför.
  applicability: Självbetjänade plattformar och automatiska leveransvägar
  capability_dependencies:
  - CAP-IT-10
  - CAP-IT-08
  - CAP-IT-07
  generation_profiles:
    G1:
      function_priority: Viktig
      shared_platform_priority: Situationsberoende
      required_offering: Dokumenterade tekniska basregler och ändringskontroll; manuellt verifierade avvikelser.
      verification: Driftsättning med osäker standardkonfiguration stoppas vid granskning.
      delivery_model: Specialiststyrd eller systemlokal installation, explicit granskning av undantag.
      organizational_responsibility: Systemägare beslutar risk och dataskydd; drift-/säkerhetsspecialister
        implementerar tekniska kontroller.
      maturity_expectation: Dokumenterad basnivå
      priority_note: Kritikalitet gäller när den beskrivna risken och tillämpningen finns; är inte ett generellt
        krav för alla organisationer.
      evidence_class: Arkitekturbedömning, grundad i källmodellens tjänstedefinition och extern vägledning.
    G2:
      function_priority: Viktig
      shared_platform_priority: Viktig
      required_offering: Gemensamma policykontroller i CI/CD och körmiljö med separata ägare för undantag.
      verification: Otillåten publik exponering upptäcks före produktion i två tekniska miljöer.
      delivery_model: Delvis central teknik och återkommande integrations-/granskningsbeställningar.
      organizational_responsibility: Gemensam säkerhetsdetektion och koordination; applikationsteam bär eget
        skydds-/åtgärdsansvar.
      maturity_expectation: Korrelerat över tjänster
      priority_note: Kritikalitet gäller när den beskrivna risken och tillämpningen finns; är inte ett generellt
        krav för alla organisationer.
      evidence_class: Arkitekturbedömning, grundad i källmodellens tjänstedefinition och extern vägledning.
    G3:
      function_priority: Kritisk
      shared_platform_priority: Kritisk
      required_offering: Policy-as-code i golden paths med automatisk enforcement, tidsbestämda undantag samt
        kontrollerad policyändring och återgång där det är tekniskt möjligt.
      verification: Otillåtet nät- eller IAM-privilegium nekas via självbetjäning utan supportärende.
      delivery_model: Versionerade skyddsprofiler, API och självbetjäning med säkra standardval samt mätbara
        undantag.
      organizational_responsibility: Plattformsproduktteam äger teknisk kontroll och adoption; säkerhetsfunktion
        anger principer; tjänsteägare rättar risker.
      maturity_expectation: Standardiserat och självbetjänat
      priority_note: Kritikalitet gäller när den beskrivna risken och tillämpningen finns; är inte ett generellt
        krav för alla organisationer.
      evidence_class: Arkitekturbedömning, grundad i källmodellens tjänstedefinition och extern vägledning.
    G4:
      function_priority: Kritisk
      shared_platform_priority: Kritisk
      required_offering: Riskklasser styr vilka AI-/agentverktyg, dataåtkomster och åtgärder som får nyttjas;
        maskinell avveckling.
      verification: Agent kan inte eskalera mandat; riskhöjning kräver godkännande och tidbegränsas.
      delivery_model: Säkra mallar och automatiska skydd även för icke-specialister; högriskåtgärder kräver
        explicit mandat och ibland mänsklig kontroll.
      organizational_responsibility: Verksamhetsägare äger användningsrisk; IT/plattform erbjuder kontroller;
        säkerhet övervakar och styr principer; domänsystem verkställer sin auktorisation.
      maturity_expectation: Riskstyrt och automatiserat även för AI
      priority_note: Kritikalitet gäller när den beskrivna risken och tillämpningen finns; är inte ett generellt
        krav för alla organisationer.
      evidence_class: Arkitekturbedömning, grundad i källmodellens tjänstedefinition och extern vägledning.
  decision_guidance:
    function_vs_platform: Funktionskrav och behov av gemensamt tjänsteerbjudande bedöms separat.
    applicability_rule: Självbetjänade plattformar och automatiska leveransvägar
    assessment: Verifiera tillämplighet och risk innan gemensam tjänst etableras eller befintlig teknik ersätts.
- id: PLS-087
  name: Webb- och API-skydd
  platform:
