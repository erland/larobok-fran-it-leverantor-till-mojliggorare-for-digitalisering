schema_version: factbook-capability-1.0
capability:
  id: CAP-IT-12
  name: Cybersäkerhet och tekniskt skydd
  source_definition: Gemensamma tekniska mekanismer för att förebygga, upptäcka, analysera och begränsa cyberhot
    samt skydda digitala resurser.
  source_boundary: Äger inte verksamhetens risk- och informationsklassning, IAM-livscykel, nätets topologi,
    secure SDLC, generell observability eller dataägarens beslut om skyddsvärde.
editorial:
  title: Cybersäkerhet och tekniskt skydd
  version: '2.0'
  date: '2026-11-07'
  audience: IT-ledning, arkitekter, säkerhets-, drift- och utvecklingsansvariga
  baseline: Organisationen befinner sig arkitektoniskt i G2; tidigare generationsarv kan kvarstå.
  source_boundary: PLS-ID och förmågekoppplingar är hämtade ur modellbaseline v1.1; generationstillämpning
    och prioriteringar är bedömningar.
  review_status: internt_kritiskt_granskad
  criticality_rule: Kritisk funktion betyder inte att särskild produkt eller gemensam plattform är obligatorisk.
    Prioriteter gäller bara när applicability uppfylls.
generation_overview:
  G1:
    summary: 'Skydd per sammanhållet system och klient: dokumenterad härdning, tillgångs- och sårbarhetsöverblick,
      manuell kontroll och incidentvägar.'
    delivery: Specialiststyrd eller systemlokal installation, explicit granskning av undantag.
    responsibility: Systemägare beslutar risk och dataskydd; drift-/säkerhetsspecialister implementerar tekniska
      kontroller.
    risk: Lokala skydd och loggar kan skapa blinda fläckar; förbättringar bygger på individer.
  G2:
    summary: 'Försvar av många sammanhängande tjänster: korrelerade säkerhetshändelser, sårbarheter över kedjor,
      starka workload-/API-skydd och kontrollerad extern anslutning.'
    delivery: Delvis central teknik och återkommande integrations-/granskningsbeställningar.
    responsibility: Gemensam säkerhetsdetektion och koordination; applikationsteam bär eget skydds-/åtgärdsansvar.
    risk: Fragmenterade verktyg och manuella regler hindrar skala; delat ansvar lämnar luckor.
  G3:
    summary: 'Säkerhet integrerad i plattformarnas standarderbjudanden: policy-as-code, automatiska kontroller,
      kontinuerlig exponering och förberedda incidentflöden.'
    delivery: Versionerade skyddsprofiler, API och självbetjäning med säkra standardval samt mätbara undantag.
    responsibility: Plattformsproduktteam äger teknisk kontroll och adoption; säkerhetsfunktion anger principer;
      tjänsteägare rättar risker.
    risk: Central policy kan bli blockerande och falsklarm höga om användbarhet och feedback inte designas.
  G4:
    summary: 'Riskklassad säkerhet för snabb AI-assisterad och verksamhetsnära utveckling: agenter, prompt-/verktygskedjor,
      dataåtkomst, kortlivade resurser och nödstopp.'
    delivery: Säkra mallar och automatiska skydd även för icke-specialister; högriskåtgärder kräver explicit
      mandat och ibland mänsklig kontroll.
    responsibility: Verksamhetsägare äger användningsrisk; IT/plattform erbjuder kontroller; säkerhet övervakar
      och styr principer; domänsystem verkställer sin auktorisation.
    risk: Agentdrivet missbruk, oavsiktlig informationsspridning och stora privilegier kan skala snabbare än
      manuell granskning.
generation_2_diagnosis:
  legacy_gaps:
  - Oinventerade tjänster och beroenden
  - Fynd och larm utan utsedd åtgärdsansvarig
  - Skydd endast på server- eller nätverksnivå
  - Säkerhetsskanning som sällanhändelse
  stabilize_g2:
  - Bygg tjänste- och exponeringsöverblick
  - Fastställ ansvar och åtgärdskedja
  - Testa detektion och begränsning
  - Koppla säkerhetsanalys till leverans
  move_toward_g3:
  - Standardisera återkommande skyddsprofiler
  - Inför automatiserade säkerhetsguardrails
  - Förvalta undantag och policyversioner
  - Automatisera även ändring och avveckling
transitions:
  G1_G2:
    purpose: Kort historisk orientering, inte obligatorisk checklista
    signals:
    - Större antal tjänster och exponerade gränssnitt
    - Komponentorienterade skydd skapar blinda fläckar
  G2_G3:
    purpose: Säkra återkommande kontroller blir konsumerbara plattformserbjudanden
    readiness:
    - Tydliga ägare
    - Tillämpliga riskprofiler
    - Mätbar skyddseffekt
    - Förvaltningskapacitet för policy och undantag
  G3_G4:
    purpose: Riskstyrda skydd tillgängliga även för verksamhetsnära och AI-assisterade lösningar
    readiness:
    - Riskklassning
    - Säkra utvecklings- och körvägar
    - Mandatkontroller vid resursen
    - Incident- och stoppfunktioner
indicators:
  need:
  - Exponerade tjänster och betydande informations- eller verksamhetsrisk
  - Många ändrade beroenden och externa integrationsflöden
  functioning_G2:
  - Väsentliga tjänster kan knytas till ägare och risk
  - Sårbarhetsfynd får ansvarig och verifierad åtgärd
  - Detektion provas med simulerad händelse
  - Säkerhetsfynd återförs till utvecklingsteam
  unsuitable_technology_G2:
  - Bristande täckning av faktiskt använda arbetslaster
  - Saknade möjligheter till korrelation
  - Höga falsklarm och okontrollerad kostnad
  - Ingen fungerande säkerhetsuppdatering eller livscykel
  functioning_G3:
  - Förvald skyddsprofil vid standardleverans
  - Tidsbundna och spårbara undantag
  - Kontrollerad policyändring och avveckling
  unsuitable_technology_G3:
  - Ingen automatiserbar policy- eller livscykelhantering
  - Alltför många felaktiga blockeringar utan feedback
  - Centralt team måste manuellt utföra varje normalfall
  functioning_G4:
  - Agentmandat verkställs vid resursen
  - Misstänkt agentaktivitet kan upptäckas och stoppas framåt i tiden
  - Skyddet kan riskdifferentieras
  unsuitable_technology_G4:
  - Otillräcklig kontroll av verktygsanrop
  - Ingen utredningsbar spårbarhet
  - Bristande riskdifferentiering
remedy_options:
- Behåll
- Komplettera
- Ändra användning och ansvar
- Ersätt
