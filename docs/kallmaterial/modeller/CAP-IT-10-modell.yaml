tolkningsregler:
  kritikalitet: Bedömer funktionens betydelse när användningsfallet finns, inte obligatoriskt införande
    av varje central tjänst.
  situationsberoende: Förmågan kan vara irrelevant när organisationen inte har den typen av lösningar;
    då ska den inte utvärderas som ett glapp.
  generation: Generationerna anger leverans- och ansvarsmönster; verktygens förekomst avgör inte ensam
    generationen.
  teknikvarning: Indikation som ska prövas med ett representativt användningsfall, inte automatisk signal
    om produktbyte.
