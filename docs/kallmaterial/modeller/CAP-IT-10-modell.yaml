metadata:
  id: CAP-IT-10
  titel: Utveckling och teknisk leverans
  typ: faktaboksunderlag
  version: '2.0'
  datum: '2026-11-07'
  modellbaseline: v1.1
  utgangspunkt: G2
  status: referensbedomning, ej organisationsspecifik inventering
  granskning: intern kritisk sak- och redaktionsgranskning; ej extern publiceringsgranskning
kallavgransning:
  primarkallor:
  - Från systemdrift till digital självständighet
  - Förmågeöversikt – tekniska IT-förmågor, CAP-IT-10
  - Plattformsöversikt – konceptuella plattformar, PLT-009 och PLT-004
  kompletteringar:
  - NIST SP 800-218
  - SLSA v1.2
  - DORA AI-assisted Software Development 2025
  - OpenSSF Scorecard
  bedomningar: Behov, generationer, kritikalitet och verifieringsprov är analytiska rekommendationer,
    ej explicit kravtext i primärkällorna.
  versionsnotering: NIST SP 800-218 v1.1 är publicerad; revidering har funnits som utkast. SLSA v1.2 är
    aktuell godkänd version vid granskningen.
definition: Förmåga att utveckla, verifiera och leverera versionshanterade tekniska förändringar på ett
  reproducerbart, spårbart och kontrollerat sätt.
avgransning: Äger leverans- och förändringsmekanism men inte arkitekturansvar för målområdet; inte generell
  processautomation, driftadministration, observability eller recovery.
generationer:
  G1:
    namn: Traditionell systemdrift
    stod: Dokumenterad och reproducerbar grundmetod; central självbetjäning är inte generellt nödvändig.
    fungerande_stod:
    - Version går att härleda till källkod och byggsteg
    fallgropar:
    - Personberoende bygg och release
    teknikvarningar:
    - Byggverktyg utan leverantörsstöd
  G2:
    namn: Distribuerade IT-stöd
    stod: Separata tjänstelivscykler med säkra automatiserade kontroller och tydliga gränssnitt.
    fungerande_stod:
    - Inkompatibla kontrakt upptäcks före release
    - Relevanta artefakter och releaser kan spåras
    - Byggartefakters ursprung kan kontrolleras mot en skyddad byggkedja; reproducerbarhet förväxlas inte
      med proveniens
    fallgropar:
    - Lokalt snabba team men långsam helhetsleverans
    - Sena integrations- och säkerhetskontroller
    teknikvarningar:
    - Pipelines saknar spårbara artefakter och kontraktstest
  G3:
    namn: Plattformsorienterad IT
    stod: Förvaltat, versionerat och användbart gemensamt erbjudande där standardfall är självbetjänade.
    fungerande_stod:
    - Team kan leverera standardfall utan specialistinsatser
    - Mallar och kontroller uppgraderas och avvecklas
    - Undantagsväg och plattformsuppgraderingar fungerar även efter projektstart
    fallgropar:
    - Portal utan automatiserad livscykel
    - Stela standardvägar
    teknikvarningar:
    - Standardvägar kan inte uppgraderas eller konsumeras via gränssnitt
  G4:
    namn: Verksamhetsnära och AI-stödd utveckling
    stod: Riskstyrd leverans av mänskligt och AI-assisterat skapade lösningar med spårbara mandat.
    fungerande_stod:
    - AI-ändringar är identifierbara, testade och riskklassade
    - Agentmandat och mänskliga beslut är spårbara
    - Verksamhetsutvecklade lösningar har dokumenterat ägarskap, riskklass och avvecklingsväg
    - AI-agenters verktygsrättigheter kan begränsas och återkallas
    fallgropar:
    - AI-kod behandlas som testad per automatik
    - Agenter får för breda rättigheter
    teknikvarningar:
    - Agentverktyg kan inte begränsas eller granskas
    - Det går inte att skilja modell-, prompt- och verktygsändringars effekter eller kontrollera farliga
      anrop
overgangar:
  G1_G2:
    syfte: Synliggör kvarstående brister efter uppdelning av applikationer i tjänster
    indikatorer:
    - Skilda byggprocesser utan versionsspårbarhet
    - Integrationstester först inför gemensam produktionssättning
    - Personliga konton eller hemligheter i byggkedja
    beslut: Rätta leveransgrund före eller parallellt med vidare plattformsarbete
  G2_G3:
    syfte: Omvandla återkommande utvecklings- och leveransmoment till produktifierad självbetjäning
    forandringstryck:
    - Många team duplicerar pipelines
    - Likartade beställningar skapar köer
    - Återkommande säkerhetsavvikelser i mallar
    beredskap:
    - Identifierad standardiserbar volym
    - Produktansvar och support
    - Versionshanterade mallar med uppgraderingsstrategi
    - Möjlighet att mäta användning och utfall
  G3_G4:
    syfte: Skala kontrollerad verksamhetsnära och AI-assisterad utveckling
    forandringstryck:
    - Mer AI-kod än verifieringskapacitet
    - Oregistrerade verksamhetsapplikationer
    - Ospårade agentändringar
    beredskap:
    - Automatiska test- och säkerhetsgrindar
    - Riskklassning och mandat
    - Ägarskap och avvecklingsprocess även för små lösningar
forbattringsspar_g2:
  A: Åtgärda versions-, kontrakts-, test-, artefakt- och rättighetsbrister utan krav på nytt plattformsprogram
  B: Utveckla återanvändbara självbetjänade leveransvägar för återkommande behov
indikatorkategorier:
- behov
- fungerande_stod
- kvarvarande_arv
- olampligt_teknik_plattformsval
- forandringstryck
- beredskap
