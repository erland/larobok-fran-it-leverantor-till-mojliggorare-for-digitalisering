- id: PLS-078
  namn: Workloadskydd
  plattform: PLT-011
  behov: Tekniskt skydd av exekverande arbetslaster
  prioritering: Skyddskritiskt enligt riskklass; särskilt verktyg situationsberoende
  generationer:
    G1:
      stod: Systemnära teknik för relevant arbetslast; form och omfattning efter behov
      plattformstjanst: Behövs inte nödvändigtvis som central tjänst
      evidensklass: arkitekturbedomning
      verifiering: Kontrollera stödstatus, ägarskap och dokumenterad uppdateringsväg för relevant teknik
    G2:
      stod: Skydd av VM/container med riskbaserad kontroll
      plattformstjanst: Kritisk skyddsfunktion efter risk
      verifiering: Prova testad hot- eller policyavvikelse och kontrollera att skydd, loggning och ansvar fungerar
      evidensklass: arkitekturbedomning
    G3:
      stod: Automatiserat skydd kopplat till godkända profiler
      plattformstjanst: Gemensam produkt om återkommande behov finns
      verifiering: Verifiera att relevant skydd aktiveras automatiskt för ny VM/containerprofil och att undantag
        är spårbara
      evidensklass: arkitekturbedomning
    G4:
      stod: Styrda skydd och återkalleligt tillträde för nya arbetslaster
      plattformstjanst: Risk- och användningsstyrd
      verifiering: Pröva att en obehörig automatiserad arbetslast hindras och att larm och ägare går att spåra
      evidensklass: framtidsscenario
  verifieringsprincip: Kontrollera faktisk tjänstefunktion skild från val av central plattform
