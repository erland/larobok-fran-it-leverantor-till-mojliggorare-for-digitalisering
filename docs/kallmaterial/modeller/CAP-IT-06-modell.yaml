verifieringsscenario_g2:
  namn: Databasändring och meddelande med två avbrottspunkter
  prov:
  - Lokal transaktion committar men publiceraren avbryts före leverans
  - Publicering lyckas men publiceraren avbryts före kvittens eller markering
  - Samma meddelande når konsumenten upprepade gånger
  forvantat: Beslutad databasändring ger så småningom avsett utbyte enligt definierade förutsättningar, dubblett identifieras
    eller kompenseras enligt verksamhetskrav; kontrollera broker och extern mottagare var för sig.
  grans: Ingen generell exakt-en-gång-verksamhetseffekt över godtyckliga externa system.
