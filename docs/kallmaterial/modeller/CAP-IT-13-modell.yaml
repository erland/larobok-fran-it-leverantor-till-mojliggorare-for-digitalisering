tolkningsregler:
- Funktionsprioritet gäller endast där tjänstens användningsfall finns.
- En kritisk funktion innebär inte att en central produkt är obligatorisk.
- G1/G2/G3/G4 är arkitektur- och leveransmönster, inte produktgenerationer.
- 'Byte av produkt föregås av orsaksanalys: teknik, implementation, ansvar eller behov.'
- Nätanslutbarhet är inte auktorisation; API-kontrakt och informationsägarskap ligger utanför förmågan.
- Kritikalitet för funktion får inte användas som automatisk prioritet för en gemensam eller egenägd plattform.
- Nätkontroller begränsar teknisk anslutbarhet men kan inte ensamma bevisa mottagaridentitet, verksamhetsbehörighet
  eller att data inte lämnar organisationen.
- Automationsmognad bedöms för skapa, ändra, felsöka, återställa och avveckla; separat undantagsflöde kan vara motiverat
  för högriskanslutningar.
bedomningsprov:
- Kartlägg ett verksamhetskritiskt trafikflöde från källa till mål inklusive DNS och nätpolicy.
- Testa ett avsett och ett otillåtet flöde.
- Prova bortfall av relevant nätkomponent och mät konsekvens.
- Skapa, ändra och avveckla en standardanslutning och följ faktisk manuell insats.
- Kontrollera ett stickprov av utgångna regler och namnposter.
