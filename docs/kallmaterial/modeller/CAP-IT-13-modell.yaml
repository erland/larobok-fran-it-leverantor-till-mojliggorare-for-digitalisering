metadata:
  id: CAP-IT-13
  titel: Nätverk och konnektivitet
  typ: faktaboksunderlag
  version: '2.0'
  datum: '2026-11-07'
  utgangspunkt: G2
  modellbaseline: v1.1
  status: Internt kritiskt granskat och reviderat; ej oberoende faktagranskat
kallavgransning:
  ursprung:
  - Från systemdrift till digital självständighet
  - Förmågeöversikt – tekniska IT-förmågor CAP-IT-13
  - Plattformsöversikt – konceptuella plattformar baseline v1.1
  externt:
  - NIST SP 800-207 Zero Trust Architecture (2020)
  - NIST SP 800-204A Service-Mesh Architecture (2020)
  - CNCF Platform engineering maturity (2026)
  analytiskt: Generationskrav, indikatorer, bedömningar, beslut och verifieringsprov är författarens referensbedömningar,
    inte direktavskrivna krav från källorna.
definition: Säker, tillgänglig, prestandamässig och förvaltningsbar teknisk konnektivitet mellan användare, enheter,
  workloads, platser, plattformar och externa nät.
avgransning: Äger reachability, inte applikationskontrakt, informationssemantik eller integrationslivscykel.
generationer:
  G1:
    roll: Kort historisk orientering
    stod: Dokumenterade och tillförlitliga zoner, adresser, namn och förbindelser; manuellt stöd kan räcka.
    behovsindikatorer:
    - Stabila system behöver skyddad kommunikation mellan kända platser och resurser
    fungerande_stod:
    - Nätberoenden är begripliga och reservvägar är provade
    teknikvarningar:
    - Nätprodukter utan uppdateringsstöd eller oanvändbar återställningsprocess
  G2:
    roll: Huvudperspektiv och nulägesdiagnos
    stod: Tjänstetrafik, DNS, segmentering, ingress och externa samband går att förstå, begränsa och felsöka.
    behovsindikatorer:
    - Många självständiga tjänster
    - Flera interna eller externa nätgränser
    - Stora konsekvenser av avbrott eller otillåtna trafikvägar
    fungerande_stod:
    - Tillåtna och nekade tjänsteflöden kan verifieras
    - Kritiska tjänstekedjor kan felsökas
    - Regler har ägare och avvecklingsrutin
    - Prov av att skapa, ändra och avveckla ett vanligt flöde samt blockera otillåtet flöde med dokumenterat resultat
    generationsarv:
    - Grova zoner från monolittiden
    - Manuell DNS och brandväggsbeställning
    - Bristande kunskap om tjänstberoenden
    teknikvarningar:
    - Saknar nödvändig trafikgranularitet eller driftsstöd
    - Saknar rimlig möjlighet till export eller automatisering
    - Kostnader skenar med antalet trafikrelationer
    forbattringsspar:
      A: Säkra och felsöka dagens distribuerade konnektivitet
      B: Standardisera repetitiva mönster till tjänsteerbjudanden
  G3:
    roll: Plattformsorienterat erbjudande
    stod: Policybaserade, automatiserade nätprofiler med självbetjäning för standardfall och kontrollerade undantag.
    behovsindikatorer:
    - Många upprepade nätbeställningar
    - Flera team konsumerar liknande trafikprofiler
    fungerande_stod:
    - Standardflöden skapas, ändras och avvecklas utan manuella specialistärenden
    - Avslag kan förstås och granskas
    - Regler och namnposter städas vid avveckling
    - Policyändringar kan valideras och felaktiga ändringar hanteras utan okontrollerade driftstörningar
    teknikvarningar:
    - Endast portal framför manuella köer
    - Ingen spårbar ändring eller maskinellt gränssnitt
    - Oklara undantag, kostnader eller tjänsteansvar
  G4:
    roll: Framåtblickande, riskstyrd konsumtion
    stod: Begränsade, spårbara och livscykelhanterade nätprofiler även för kortlivade verksamhets- och AI-lösningar.
    behovsindikatorer:
    - Verksamhetsnära utveckling
    - Tillfälliga automatiserade processer
    - Varierande risk för extern åtkomst
    fungerande_stod:
    - Tillfälliga nätvägar avvecklas automatiskt
    - Otillåtna mål blockeras
    - Ansvariga och kostnader kan härledas
    teknikvarningar:
    - AI-agenter har obegränsad egress
    - Nätverkspolicy saknar tillämpning för kortlivade workloads
    - Stopp av trafik misstas för återkallande av redan utförda handlingar
overgangar:
  G1_G2:
    syfte: Förklara distribuerade beroenden och kvarvarande generationsarv, inte en fullständig historisk implementationsplan
  G2_G3:
    syfte: Gör repetitiva anslutningsmönster till förvaltade plattformstjänster när effekten motiverar det
    beredskap:
    - Inventerade beroenden och ägare
    - Standardprofiler och undantagsregler
    - Säker automation och avveckling
    - Mätbar ledtid och kvalitet
    - Underbyggt med mätning av frekventa normalfall, driftskostnad och förväntad nytta
  G3_G4:
    syfte: Riskstyrd konsumtion för fler självständiga och kortlivade lösningar
    beredskap:
    - Profil för riskklass och egress
    - Ansvar och avveckling
    - Spårbar maskinell åtkomst
plattformstjanster:
- id: PLS-057
  namn: Lastbalansering och ingress
  plattform:
    id: PLT-031
    name: Applikationsleverans- och ingressplattform
  tillamplighet: När trafik ska exponeras/fördelas
  grunduppdrag_enligt_kallmodell: Trafikdistribution och standardiserad ingress, åtskild från WAF och API Management
  generationer:
    G1:
      funktionellt_stod: Manuellt konfigurerad lastbalansering och dokumenterade externa ingångar för system som
        behöver redundans.
      funktionsprioritet_i_tillampligt_fall: Viktig
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Specialist-/projektstyrd; dokumenterade konfigurationer
      verifieringsprov: Vid bortfall av en applikationsinstans styrs trafik till frisk instans enligt plan.
      fordjupat_prov: Prova felaktig backend, felaktigt certifikat och avveckling av en exponerad tjänst.
    G2:
      funktionellt_stod: Tjänstevis routning, hälsokontroller, TLS-hantering och spårbar konfiguration för flera
        oberoende komponenter.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig
      leveransform: Tjänste-/miljöorienterad med gemensam koordinering
      verifieringsprov: Simulerat fel i en tjänst isoleras utan att övriga ingångar påverkas.
      fordjupat_prov: Prova felaktig backend, felaktigt certifikat och avveckling av en exponerad tjänst.
    G3:
      funktionellt_stod: Självbetjänad ingress med standardprofiler, deklarativ routing, automatisk certifikathantering
        och skyddade undantag.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig vid återkommande behov; annars situationsberoende
      leveransform: Deklarativ självbetjäning inom policy och versionsstyrda undantag
      verifieringsprov: Godkänd tjänst publiceras genom standardprofil; kontrollera hälsokontroller, certifikatlivscykel
        och säker avveckling.
      fordjupat_prov: Prova felaktig backend, felaktigt certifikat och avveckling av en exponerad tjänst.
    G4:
      funktionellt_stod: Riskklassad exponering av verksamhets- och AI-lösningar med automatisk avveckling, kvoter
        och spårbar extern åtkomst.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig vid återkommande behov; annars situationsberoende
      leveransform: Riskstyrd maskinkonsumtion, begränsade mandat och automatisk avveckling
      verifieringsprov: Otillåten exponering nekas och en tidsbegränsad testingress tas bort automatiskt.
      fordjupat_prov: Prova felaktig backend, felaktigt certifikat och avveckling av en exponerad tjänst.
  varningssignal: Ingress som döljer fel eller är beroende av manuell konfiguration.
  beroenden:
  - CAP-IT-08
  - CAP-IT-09
  - CAP-IT-12
- id: PLS-079
  namn: Säker extern system- och myndighetsanslutning
  plattform:
    id: PLT-035
    name: B2B- och filutbytesplattform
  tillamplighet: Endast vid externa part-/myndighetsanslutningar
  grunduppdrag_enligt_kallmodell: Sammansatt onboarding, tillit, konnektivitet och informationsutbyte med externa
    parter; ersätter inte underliggande tjänster
  generationer:
    G1:
      funktionellt_stod: Partsspecifika nätverksförbindelser, kontaktvägar, certifikat och manuella anslutningsrutiner.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Situationsberoende
      leveransform: Specialist-/projektstyrd; dokumenterade konfigurationer
      verifieringsprov: En extern part kan kopplas bort och återanslutas efter dokumenterad rutin.
      fordjupat_prov: Prova partnerbyte, certifikatrotation och kontrollerad frånkoppling.
    G2:
      funktionellt_stod: Standardiserad partinventering, krypterade anslutningar och testade beroenden mellan anslutning
        och informationsutbyte.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig
      leveransform: Tjänste-/miljöorienterad med gemensam koordinering
      verifieringsprov: Bytt partnercertifikat orsakar inte okontrollerat avbrott; utbyte kan felsökas över gränsen.
      fordjupat_prov: Prova partnerbyte, certifikatrotation och kontrollerad frånkoppling.
    G3:
      funktionellt_stod: Återanvändbara anslutningsprofiler, automatiserad teknisk onboarding och versionsstyrda
        tillits- och trafikpolicyer.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig vid återkommande behov; annars situationsberoende
      leveransform: Deklarativ självbetjäning inom policy och versionsstyrda undantag
      verifieringsprov: En godkänd ny part ansluts genom standardflöde och får spårbar ägare och avvecklingsdatum.
      fordjupat_prov: Prova partnerbyte, certifikatrotation och kontrollerad frånkoppling.
      bedomningsnotering: Automatiserad teknisk onboarding för godkända parter kan vara lämplig; partsgodkännande
        och informationsutbyte kan kräva separat prövning.
    G4:
      funktionellt_stod: Policy- och riskstyrd anslutning för nya verksamhetsflöden och agentanrop, med begränsade
        mandat och granskbara dataflöden.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig vid återkommande behov; annars situationsberoende
      leveransform: Riskstyrd maskinkonsumtion, begränsade mandat och automatisk avveckling
      verifieringsprov: Agent kan inte skapa okänd extern part eller utöka dataåtkomst utan godkännande.
      fordjupat_prov: Prova partnerbyte, certifikatrotation och kontrollerad frånkoppling.
      bedomningsnotering: Automatiserad teknisk onboarding för godkända parter kan vara lämplig; partsgodkännande
        och informationsutbyte kan kräva separat prövning.
  varningssignal: Anslutningar utan tydligt part- och informationsansvar.
  beroenden:
  - CAP-IT-06
  - CAP-IT-07
  - CAP-IT-12
- id: PLS-072
  namn: Datacenter- och plattformskonnektivitet
  plattform:
    id: PLT-032
    name: Datacenter- och plattformsnätverksplattform
  tillamplighet: Datacenter-/plattformsmiljöer
  grunduppdrag_enligt_kallmodell: Interna trafikvägar inom och mellan datacenter och plattformsmiljöer
  generationer:
    G1:
      funktionellt_stod: Stabila VLAN/subnät, redundanta förbindelser och dokumenterad drift för servermiljöer.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig
      leveransform: Specialist-/projektstyrd; dokumenterade konfigurationer
      verifieringsprov: En avsedd server når rätt tjänst via dokumenterad väg; reservlänk provas.
      fordjupat_prov: Prova bortfall av nätväg mellan plattformar och mät påverkan på kritiskt tjänsteflöde.
    G2:
      funktionellt_stod: Routning och segmentering mellan många workloads, kontroll av öst–väst-trafik och kapacitetsuppföljning.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig vid flera driftmiljöer; annars situationsberoende
      leveransform: Tjänste-/miljöorienterad med gemensam koordinering
      verifieringsprov: En otillåten tjänst-till-tjänst-förbindelse blockeras och avvikelse kan lokaliseras.
      fordjupat_prov: Prova bortfall av nätväg mellan plattformar och mät påverkan på kritiskt tjänsteflöde.
    G3:
      funktionellt_stod: Deklarativ nätverksprovisionering för kluster och miljöer, standardiserad egress och lifecycle-koppling
        till workloads.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Kritisk
      leveransform: Deklarativ självbetjäning inom policy och versionsstyrda undantag
      verifieringsprov: Ny standardmiljö får tillåten konnektivitet utan manuell adress- eller brandväggshantering.
      fordjupat_prov: Prova bortfall av nätväg mellan plattformar och mät påverkan på kritiskt tjänsteflöde.
    G4:
      funktionellt_stod: Dynamiska isoleringsprofiler för tillfälliga AI-/verksamhetsworkloads och automatisk nedstängning
        av kommunikationsvägar.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Kritisk
      leveransform: Riskstyrd maskinkonsumtion, begränsade mandat och automatisk avveckling
      verifieringsprov: Kortlivat jobb får bara godkända flöden och inga kvarstående vägar efter avveckling.
      fordjupat_prov: Prova bortfall av nätväg mellan plattformar och mät påverkan på kritiskt tjänsteflöde.
  varningssignal: Oklara trafikvägar och bristande redundans mellan miljöer.
  beroenden:
  - CAP-IT-08
  - CAP-IT-09
  - CAP-IT-12
- id: PLS-054
  namn: DNS och IPAM
  plattform:
    id: PLT-012
    name: Enterprise nätverksplattform
  tillamplighet: Alla nät med adresserade resurser
  grunduppdrag_enligt_kallmodell: Namnuppslagning, IP-adresshantering och nätverksmetadata
  generationer:
    G1:
      funktionellt_stod: Kontrollerade DNS-zoner, adressplan och dokumenterade ändringar.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig
      leveransform: Specialist-/projektstyrd; dokumenterade konfigurationer
      verifieringsprov: Namn och IP kan härledas till korrekt ägare; felaktig ändring kan återgå.
      fordjupat_prov: Kontrollera ett namnbyte och att uttjänta poster tas bort utan att andra tjänster påverkas.
    G2:
      funktionellt_stod: Inventering av tjänsteadresser och namn i flera miljöer, automatiserad upptäckt och konflikthantering.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig vid många miljöer; annars situationsberoende
      leveransform: Tjänste-/miljöorienterad med gemensam koordinering
      verifieringsprov: Adresskonflikt upptäcks innan driftsättning och beroende till tjänst kan spåras.
      fordjupat_prov: Kontrollera ett namnbyte och att uttjänta poster tas bort utan att andra tjänster påverkas.
    G3:
      funktionellt_stod: API-/IaC-styrd DNS/IPAM, standardiserade miljözoner, livscykelkopplade poster och automatisk
        städning.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Kritisk
      leveransform: Deklarativ självbetjäning inom policy och versionsstyrda undantag
      verifieringsprov: Skapande och borttagning av workload uppdaterar namn och adressmetadata utan handgrepp.
      fordjupat_prov: Kontrollera ett namnbyte och att uttjänta poster tas bort utan att andra tjänster påverkas.
    G4:
      funktionellt_stod: Snabb, styrd provisionering och avveckling av kortlivade lösningar med ägare, TTL och policybegränsningar.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Kritisk
      leveransform: Riskstyrd maskinkonsumtion, begränsade mandat och automatisk avveckling
      verifieringsprov: Tillfälliga miljöer lämnar inga föräldralösa namnposter.
      fordjupat_prov: Kontrollera ett namnbyte och att uttjänta poster tas bort utan att andra tjänster påverkas.
  varningssignal: Föräldralösa poster, adresskonflikter och manuella DNS-ändringar.
  beroenden:
  - CAP-IT-08
  - CAP-IT-10
- id: PLS-055
  namn: LAN och trådlöst nätverk
  plattform:
    id: PLT-012
    name: Enterprise nätverksplattform
  tillamplighet: När arbetsplatser eller lokala enheter ska anslutas
  grunduppdrag_enligt_kallmodell: Lokal och trådlös konnektivitet för användare, enheter och lokala miljöer
  generationer:
    G1:
      funktionellt_stod: Fungerande trådbundet/trådlöst nät, bassegmentering, reservrutiner och konfigurationsstyrning.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig
      leveransform: Specialist-/projektstyrd; dokumenterade konfigurationer
      verifieringsprov: Kritisk arbetsplats förblir ansluten enligt definierad tillgänglighetsprofil.
      fordjupat_prov: Kontrollera att okänd klient isoleras och att godkänd enhet får rätt nätprofil.
    G2:
      funktionellt_stod: Enhetsbaserad segmentering, central policy och uppföljning av kapacitet när fler digitala
        tjänster används.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig
      leveransform: Tjänste-/miljöorienterad med gemensam koordinering
      verifieringsprov: Okänd enhet får inte åtkomst till skyddat segment.
      fordjupat_prov: Kontrollera att okänd klient isoleras och att godkänd enhet får rätt nätprofil.
    G3:
      funktionellt_stod: Policybaserad onboarding, NAC/integrerad identitet och gemensamma anslutningsprofiler för
        användare och IoT.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig
      leveransform: Deklarativ självbetjäning inom policy och versionsstyrda undantag
      verifieringsprov: Ny enhet får rätt nätprofil utan manuell portkonfiguration.
      fordjupat_prov: Kontrollera att okänd klient isoleras och att godkänd enhet får rätt nätprofil.
    G4:
      funktionellt_stod: Risk- och kontextstyrd anslutning för fler verksamhetsnära enheter och edge/AI-klienter.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig
      leveransform: Riskstyrd maskinkonsumtion, begränsade mandat och automatisk avveckling
      verifieringsprov: En komprometterad enhet isoleras med dokumenterad återinträdesprocess.
      fordjupat_prov: Kontrollera att okänd klient isoleras och att godkänd enhet får rätt nätprofil.
  varningssignal: För stor tillit till enheter enbart därför att de finns på internt LAN.
  beroenden:
  - CAP-IT-07
  - CAP-IT-11
  - CAP-IT-12
- id: PLS-071
  namn: WAN och platskonnektivitet
  plattform:
    id: PLT-012
    name: Enterprise nätverksplattform
  tillamplighet: Endast vid flera platser
  grunduppdrag_enligt_kallmodell: Anslutningar mellan kontor, verksamhetsplatser och datacenter
  generationer:
    G1:
      funktionellt_stod: Driftsatta platsförbindelser med kapacitetsmål, reservväg för kritiska platser och tydliga
        avtal.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig
      leveransform: Specialist-/projektstyrd; dokumenterade konfigurationer
      verifieringsprov: Avbrott i primär länk ger förväntad reservfunktion.
      fordjupat_prov: Simulera degraderad förbindelse och verifiera kritiska flöden och reservväg.
    G2:
      funktionellt_stod: Mätbar latens, kapacitet och redundans för distribuerade beroenden; tydliga prioriteringar
        för kritiska flöden.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig
      leveransform: Tjänste-/miljöorienterad med gemensam koordinering
      verifieringsprov: Kedjetest visar beteende vid paketförlust och degraderad WAN-länk.
      fordjupat_prov: Simulera degraderad förbindelse och verifiera kritiska flöden och reservväg.
    G3:
      funktionellt_stod: Standardiserade platsprofiler, central policy och automatiserad driftsättning där det är
        praktiskt möjligt.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig
      leveransform: Deklarativ självbetjäning inom policy och versionsstyrda undantag
      verifieringsprov: Ny plats ansluts med godkänd profil och verifierad uppföljning.
      fordjupat_prov: Simulera degraderad förbindelse och verifiera kritiska flöden och reservväg.
    G4:
      funktionellt_stod: Flexibel och säker anslutning för verksamhetsnära samt tillfälliga platser med riskbaserad
        kontinuitet.
      funktionsprioritet_i_tillampligt_fall: Kritisk
      gemensam_plattform_i_tillampligt_fall: Viktig
      leveransform: Riskstyrd maskinkonsumtion, begränsade mandat och automatisk avveckling
      verifieringsprov: Tillfällig verksamhetsplats kan etableras och avvecklas med spårbar policy.
      fordjupat_prov: Simulera degraderad förbindelse och verifiera kritiska flöden och reservväg.
  varningssignal: WAN med uppmätt uptime men oacceptabla svarstider för tjänstekedjan.
  beroenden:
  - CAP-IT-09
  - CAP-IT-12
- id: PLS-089
  namn: Mediedistribution och streaming
  plattform:
    id: PLT-016
    name: Mediebearbetnings- och distributionsplattform
  tillamplighet: Endast om tjänster med mediedistribution/streaming finns
  grunduppdrag_enligt_kallmodell: Åtkomstkontrollerad distribution av bild, video och ljud med cache/edge och eventuellt
    adaptiv streaming
  generationer:
    G1:
      funktionellt_stod: Enkel kontrollerad leverans av statiska bilder och videofiler med lämplig kapacitet.
      funktionsprioritet_i_tillampligt_fall: Situationsberoende
