id: CAP-IT-05
namn: Analys, sökning och intelligent informationsbearbetning
version: '2.0'
datum: '2026-11-07'
status: Kritiskt granskad faktaboksversion; inte en organisations nulägesmätning
kallmodell: Baseline v1.1; CAP/PLS/PLT-identiteter bevarade från fördjupningsanalysen
kallor:
  ursprung:
  - Förmågeöversikt – tekniska IT-förmågor
  - Plattformsöversikt – konceptuella plattformar
  - Från systemdrift till digital självständighet
  kompletterande:
  - https://www.nist.gov/itl/ai-risk-management-framework
  - https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-generative-artificial-intelligence
  - https://cloud.google.com/discover/what-is-data-lineage
  - https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
  - https://sre.google/workbook/data-processing/
  - https://genai.owasp.org/llm-top-10/
definition: Förmåga att erbjuda återanvändbart stöd för att hitta, sammanställa, analysera, klassificera, prediktera
  och generera information med ändamålsenliga kvalitets- och kontrollmekanismer.
avgransning:
- Deterministiska verksamhetsregler (CAP-IT-03)
- Ägarskap av underliggande verksamhetsdata (CAP-IT-04 och verksamhetsägare)
- Domänspecifika beslut enbart för att AI används
- Generell agentorkestrering och utvecklingsramverk (CAP-IT-10)
- Åtkomst- och identitetsmekanismer (CAP-IT-07)
bedomningsprincip:
  skilj:
  - funktionskritikalitet för faktiskt användningsfall
  - behov av gemensamt förvaltat erbjudande
  - behov av automation
  notering: Tjänster, produkter och ML-teknik är inte obligatoriska per generation; G4 är scenario. Prioriteringar
    ska prövas lokalt. Kritisk analysverksamhet innebär inte i sig att semantiskt lager, egen ML-plattform eller
    GPU behövs.
generationer:
  G1:
    roll: Kort kontext
    risk: Lokala rapporter, personberoende definitioner och bristande spårbarhet.
  G2:
    roll: Huvudperspektiv
    generationsarv:
    - Flera kopior av samma data och olika definitioner av nyckeltal
    - Sena, felaktiga eller överhoppade transformationer
    - Inaktuella sökindex eller otillåtna sökträffar
    - Analysmodeller utan verifierad verksamhetsnytta eller säker användning
    - Händelsetid och registreringstid sammanblandas; sena rättelser ändrar tidigare rapporter utan spårbarhet
    - Otillförlitlig AI-utvärdering på grund av data- eller framtidsläckage
    forbattringsspar:
      A: Rätta definitioner, dataägarskap, versionsspårbarhet, kvalitetskontroll och faktisk åtkomst redan i G2.
      B: Mät flera teams återkommande behov och förvaltningskostnad innan en gemensam tjänst införs.
  G3:
    roll: Produktifierade självbetjänade tjänster där återkommande behov finns
    fungerande_stod:
    - Godkända datakontrakt och tydlig måttförvaltning
    - Självbetjäning även vid ändring, uppgradering och avveckling
    - Separata konsumentprov och kostnadskontroll
    - Budget- och livscykelkontroller även vid hög belastning och avslutade arbetsytor
    - Spårbar rättelse av tidigare publicerade analysresultat; kodrollback är inte verksamhetsrättelse
    teknikvarningar:
    - En gemensam produkt gör rapporter mindre tillförlitliga
    - Konsumenter kan inte uppgradera eller avsluta användningen utan specialprojekt
  G4:
    roll: Framåtblickande verksamhetsnära analys med AI som valfri komplettering
    fungerande_stod:
    - Rätt källversion och källåtkomst
    - Separata evals för retrieval och svar
    - Riskbaserat mandat och publiceringskontroll
    teknikvarningar:
    - AI-svar får myndighet utan stöd i källor eller verksamhetsansvar
    - Verktyg kan inte stoppas eller granskas vid riskfylld användning
    - Obetrodda källdokument kan påverka verktygsanrop eller leda till informationsläckage
diagnostiskt_scenario:
  namn: Tre motstridiga rapporter och en AI-sammanfattning
  prov:
  - Enas om ett mätbegrepp, population och tidsregler
  - Följ varje rapport genom källversion och transformering
  - Reproducera en sen korrigering och en återpublicering
  - Testa sökindexets inaktuella dokument och återkallad behörighet
  - Prova genererat svar från fel rapportversion
  - Mät om en ny plattform alls behövs efter grundfelsrättningen
  - Ändra historiskt mått med tidsgräns; jämför vad vi visste då mot vad vi vet nu
  - Lägg skadlig instruktion i återfunnet dokument; kontrollera att ingen otillåten data eller åtgärd läcker
  - Jämför reproducerbar förklaring med faktiskt möjlig exakt återkörning
beslutsordning:
- Verifiera frågan och verksamhetsdefinitionen
- Undersök källdata, transformationer och behörighet
- Rätta generationsarv utan att vänta på plattform
- Mät återkommande behov hos flera team
- Jämför behålla, komplettera, ändra användning/ansvar eller ersätta
plattformstjanster:
- id: PLS-017
  namn: Förvaltad LLM-tjänst
  plattform:
    id: PLT-004
    namn: AI- och ML-plattform
  grunduppdrag_enligt_kallmodell: Styrd modellåtkomst med modellgateway, routing, kvoter och kostnadskontroll
  tillamplighet: När generativa modeller behöver användas i produktion
  avgransning: Ger modellåtkomst – inte agentramverk, retrieval eller godkännande av verksamhetsbeslut
  generationer:
    G1:
      generationsroll: Systemnära analys och sökning
      funktionens_kritikalitet: Situationsberoende
      behov_av_gemensam_plattform: Situationsberoende
      automationsbehov: Inte ett generationskrav; automatisera endast där verklig nytta finns
      tekniskt_stod: Ingen generell LLM-funktion krävs; enskilda experiment bör hållas åtskilda från produktionsbeslut
      ansvar: Ansvarig verksamhets-/informationsägare definierar användningen; tekniskt team verkställer och förvaltar.
      verifieringsprov: Verifiera leverantörs- och informationsvillkor för ett konkret LLM-pilotfall; ingen allmän
        LLM-funktion förutsätts.
      forutsattning: Endast när användningsfall och dataförutsättningar motiverar tjänsten.
      tolkning: Verifikation av teknisk funktion är inte ensam en verifiering av korrekt verksamhetsutfall.
    G2:
      generationsroll: Distribuerade källor – spårbar och säker analys
      funktionens_kritikalitet: Situationsberoende
      behov_av_gemensam_plattform: Situationsberoende
      automationsbehov: Styrs av volym, risk och behov; inte enbart generation
      tekniskt_stod: Kontrollerade piloter med informationsklassning, leverantörsvillkor och tokenbudget per applikation
      ansvar: Ansvarig verksamhets-/informationsägare definierar användningen; tekniskt team verkställer och förvaltar.
      verifieringsprov: Använd en syntetisk testprompt avsedd för pilotmiljön; kontrollera informationspolicy, leverantörsvillkor,
        datalagring och budget utan att skicka verkliga hemligheter.
      forutsattning: Endast när användningsfall och dataförutsättningar motiverar tjänsten.
      tolkning: Verifikation av teknisk funktion är inte ensam en verifiering av korrekt verksamhetsutfall.
    G3:
      generationsroll: Förvaltade, självbetjänade analys- och AI-erbjudanden
      funktionens_kritikalitet: Situationsberoende
      behov_av_gemensam_plattform: Situationsberoende
      automationsbehov: Automatisera återkommande provisionering, policyprov, ändring och avveckling där tjänsten
        används
      tekniskt_stod: Gemensam gateway med tillåtna modeller, autentisering, kvoter, versionsbyte, loggning och isolerade
        konsumenter
      ansvar: Plattformsteam äger tjänstens livscykel; data- och verksamhetsägare äger betydelse och tillåtna användningar.
      verifieringsprov: Byt godkänd modellversion hos två team och jämför kvalitet, kvot, datalagringsvillkor, kostnad
        och hur tidigare publicerade svar skulle rättas vid fel.
      forutsattning: Endast när användningsfall och dataförutsättningar motiverar tjänsten.
      tolkning: Verifikation av teknisk funktion är inte ensam en verifiering av korrekt verksamhetsutfall.
    G4:
      generationsroll: Riskstyrd verksamhetsnära informationsbearbetning
      funktionens_kritikalitet: Situationsberoende
      behov_av_gemensam_plattform: Situationsberoende
      automationsbehov: Automatisera återkommande provisionering, policyprov, ändring och avveckling där tjänsten
        används
      tekniskt_stod: Riskstyrd modellåtkomst för verksamhetsappar/agenter med verktygsbegränsningar, utvärdering
        och återkallelse
      ansvar: Plattformsteam äger tjänstens livscykel; data- och verksamhetsägare äger betydelse och tillåtna användningar.
      verifieringsprov: Spärra en modell och ett mandat för verksamhetsnära konsument; kontrollera att nya anrop
        stoppas, inte att tidigare svar kan göras ogjorda.
      forutsattning: Endast när användningsfall och dataförutsättningar motiverar tjänsten.
      tolkning: Verifikation av teknisk funktion är inte ensam en verifiering av korrekt verksamhetsutfall.
