kvalitetsmatning:
  skilda_dimensioner:
  - verksamhetsmässig korrekthet och måttdefinition
  - datakvalitet, färskhet och fullständighet
  - sökrelevans och auktoriserad åtkomst
  - AI-svarens korrekthet och stöd i källor
  - faktisk verksamhetseffekt, kostnad och felkonsekvens
  varning: En grön pipeline eller bra modellpoäng verifierar inte ensam dessa övriga dimensioner.
